[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fxvol"
version = "1.0.0rc1"   # the one version source (#353): scripts/ci/release_version.py semver -> 1.0.0-rc.1
description = "FX Volatility Trading System — microservices pipeline + research-grade vol signals + React cockpit + IB execution"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
authors = [{ name = "Valérian Darmenté" }]

# Base runtime — every service container needs these.
# Engines + db-writer + api all install at minimum this set.
dependencies = [
    # Ceilings on every runtime dependency (#303, audit 10#5): the resolved
    # set is uv.lock; a major bump is a deliberate PR (docs/ops/dependency-policy.md).
    # pandas 3 (copy-on-write, string dtype) is held back for v1.0 on purpose.
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pandas>=2.2,<3",
    "redis>=5.0,<6.0",
    "structlog>=24.1,<25.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "SQLAlchemy>=2.0,<2.1",
    "asyncpg>=0.32.0,<0.33",
    "alembic>=1.20.1,<1.21",
    # P0 observability — every container ships /metrics. Tiny (<200 KB).
    "prometheus-client>=0.19,<1",
    # P2 observability — OTel SDK for distributed tracing → Tempo.
    # Auto-instrumentation for SQLAlchemy + Redis kept off-tree to avoid
    # forced wiring on test envs (engines import them explicitly).
    "opentelemetry-api>=1.27,<2.0",
    "opentelemetry-sdk>=1.27,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27,<2.0",
]

# Optional dependency groups — one per container archetype, plus tooling.
# Engines pin only what they truly use ; the FastAPI extras keep the api
# container slim ; the dev set is for local + CI.
[project.optional-dependencies]

# ── Container-shaped extras ────────────────────────────────────────────
api = [
    # fastapi / starlette on the supported line (#303, audit 10#1): the old
    # <0.112 ceiling froze starlette 0.37 with nine published advisories.
    "fastapi>=0.120,<1",
    "uvicorn[standard]>=0.54.0,<1",
    "slowapi>=0.1.9,<0.2",
    "httpx>=0.27,<1",
]

# market-data + risk-engine + execution-engine talk to Interactive Brokers.
ib = [
    "ib-insync==0.9.86",
    # Required by ib_insync.parseIBDatetime which uses ZoneInfo('US/Central').
    # python:3.11-slim does NOT ship system tzdata ; without this, IB callbacks
    # crash silently on accounts with execution history. Documented incident
    # 28/04/2026 (sandbox R9).
    "tzdata>=2024.1",
]

# vol-engine — IB + GARCH + DB read-side for Step 1 regime gating.
quant = [
    "fxvol[ib]",
    "arch>=6.0,<9",
    # Step 1 §3 zone 2 — GMM 3-component over (vol_level, vol_of_vol,
    # term_slope) → P(regime=calm/stressed/pre_event). Replaces the
    # threshold heuristic once feature_history has accumulated enough obs.
    "scikit-learn>=1.9.1,<1.10",
]

# db-writer — never imports ib_insync (smaller image + smaller attack surface).
writer = [
    "psycopg2-binary>=2.9,<3.0",
]

# ── Tooling extras ─────────────────────────────────────────────────────

# Sole local + CI dev set : lint, type-check, test runner, async test
# helpers, the in-memory SQLite driver used by the writer's unit tests,
# and the architecture lint (import-linter, contracts in .importlinter).
dev = [
    "ruff>=0.17.4,<0.18",
    "mypy>=1.10",
    # <9.2 : pytest 9.2 dropped FixtureManager._arg2fixturedefs (CI red
    # 2026-11-04). pytest-asyncio 1.x : 0.23 fails to collect a tests/
    # PACKAGE on pytest 9 ("'Package' object has no attribute 'obj'", CI
    # red 2026-11-07 once tests/__init__.py landed with the shared harness).
    "pytest>=9.2.0,<9.3",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5,<8",
    "aiosqlite>=0.22.1,<0.23",
    "import-linter>=2.0,<3.0",
    # Test harness (#338): randomised order so hidden ordering coupling
    # surfaces in CI (seed printed, replay with --randomly-seed), and a
    # frozen clock instead of sleeps / datetime.now() in assertions.
    "pytest-randomly>=3.15,<6",
    "freezegun>=1.4,<2",
    "pyyaml>=6,<7",   # tests parse obs/alerts.yml + alertmanager.yml (#342)
    "hypothesis>=6.100,<7",  # property tests on the pricing kernel (#309)
]

# ─────────────────────────────────────────────────────────────────────
# Tool config — single source of truth (replaces ruff.toml, pytest.ini).
# ─────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific
    "DTZ",   # flake8-datetimez: no naive datetimes anywhere (#326, audit 05#7)
]
ignore = [
    "E501",   # line too long (handled by line-length)
    "B008",   # function call in default arg (common in FastAPI Depends)
    "B023",   # function uses loop variable (asyncio lambda patterns)
    "SIM105", # suppressible-exception (contextlib.suppress less readable)
    "SIM103", # needless-bool (readability)
    "SIM108", # ternary instead of if/else (readability)
    "RUF001", # ambiguous unicode (accented chars in French comments)
    "RUF002", # ambiguous unicode in docstring
    "RUF003", # ambiguous unicode in comment
    "RUF012", # mutable class default (FastAPI Field default factory)
]

[tool.ruff.lint.isort]
known-first-party = ["api", "bus", "core", "engines", "persistence", "shared"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018", "DTZ"]  # tests build naive datetimes on purpose (#326); the rule guards src/  # useless expression (assert patterns)

[tool.pytest.ini_options]
minversion = "8.0"
# Pin collection to the curated test buckets. The historical ``tests/old/``
# quarantine has been removed — its last survivor (the nginx-config parse
# test) now lives under ``tests/unit/infrastructure/`` and is collected here.
testpaths = ["tests/unit", "tests/integration"]
# "." makes tests.fixtures importable (shared DB / IB / payload fixtures, #338).
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: Fast isolated tests with mocks only.",
    "integration: Tests requiring a running IB Gateway/TWS instance.",
    "db_integration: Tests requiring a running PostgreSQL instance and DATABASE_URL.",
    "redis_integration: Tests requiring a running Redis instance and REDIS_URL.",
]

[tool.coverage.run]
source = ["src"]
# Migrations run in the live-integration job (upgrade head + round trip),
# never in the unit suite; counting them would hide the code that is tested.
omit = ["src/persistence/migrations/*"]

[tool.coverage.report]
# src/ is namespace packages (no __init__.py): without this, a module no test
# imports is absent from the report instead of counted at 0 %, and the first
# test that imports it moves the package's number (#340).
include_namespace_packages = true
# Global floor (#340); the per-package floors below are the real gate.
fail_under = 63

[tool.fxvol.coverage-floors]
# Line coverage per src/ package, checked in CI by scripts/check_coverage.py
# against the unit suite (#340, audit 07#13). Set ~1 point under the number
# measured on 2026-11-10 with honest denominators (every module counted,
# imported or not; migrations omitted). They only move up; the script says
# when one can.
"core" = 95
"bus" = 77
"shared" = 85
"persistence" = 88
"api/middleware" = 98
"api/schemas" = 98
"api/ws" = 93
"api/orchestration" = 47
"api/routers" = 39
"engines/db_writer" = 72
"engines/market_data" = 54
"engines/analytics" = 58
"engines/execution" = 59
"engines/risk" = 46
"engines/vol" = 22

[tool.mypy]
python_version = "3.11"
# Permissive baseline for the whole tree (the advisory CI run); the three
# clean packages are GATED in CI with the same config: `python -m mypy
# src/shared src/bus src/persistence` must report zero errors (#335, audit
# 06#8). Roadmap in docs/architecture/backend.md: core next, then api,
# then engines, each one flipped to the gate when its count reaches zero.
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
files = ["src"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
# Gated packages: no implicit Optional, every def typed where it matters.
module = ["shared.*", "bus.*", "persistence.*"]
no_implicit_optional = true
warn_return_any = false

# ─────────────────────────────────────────────────────────────────────
# uv-specific config — only kicks in when uv is the runner.
# ─────────────────────────────────────────────────────────────────────

[tool.uv]
# uv.lock is the one resolved set (#303): CI (`uv sync --locked`) and every
# Dockerfile install from it; `requires-python` keeps it on the 3.11 line.
# Refresh with `uv lock --upgrade-package <name>` (or Dependabot's pip PRs).

# ─────────────────────────────────────────────────────────────────────
# setuptools — find packages under src/ (PyPA src-layout).
# ─────────────────────────────────────────────────────────────────────

[tool.setuptools.packages.find]
where = ["src"]
include = ["api*", "bus*", "core*", "engines*", "persistence*", "shared*"]
