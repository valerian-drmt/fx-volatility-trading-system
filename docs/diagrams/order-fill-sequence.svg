<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1010" viewBox="0 0 1100 1010" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="1010" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555"/></marker>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d9480f"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#146c43"/></marker>
    <style>.h{paint-order:stroke;stroke:#ffffff;stroke-width:5px;stroke-linejoin:round}</style>
  </defs>
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">A live structure: each leg is committed as it is placed, its fills arrive later as IB events</text>

  <!-- lifeline heads -->
  <g fill="#222" font-weight="bold" text-anchor="middle">
    <rect x="15" y="48" width="150" height="40" rx="4" fill="#ffffff" stroke="#555"/><text x="90" y="66">api</text>
    <text x="90" y="81" font-weight="normal" fill="#555">trade.submit_preview</text>
    <rect x="195" y="48" width="170" height="40" rx="4" fill="#fbe3d6" stroke="#d9480f"/><text x="280" y="66">execution-engine</text>
    <text x="280" y="81" font-weight="normal" fill="#555">submit_structure_live</text>
    <rect x="410" y="48" width="140" height="40" rx="4" fill="#ffffff" stroke="#555"/><text x="480" y="66">IB Gateway</text>
    <text x="480" y="81" font-weight="normal" fill="#555">clientId 5</text>
    <rect x="590" y="48" width="160" height="40" rx="4" fill="#fbe3d6" stroke="#d9480f"/><text x="670" y="66">fills_handler</text>
    <text x="670" y="81" font-weight="normal" fill="#555">ib_async callbacks</text>
    <rect x="790" y="48" width="160" height="40" rx="4" fill="#fff3cd" stroke="#b7791f"/><text x="870" y="66">Postgres</text>
    <text x="870" y="81" font-weight="normal" fill="#555">trade_order, trade_fill</text>
    <rect x="970" y="48" width="120" height="40" rx="4" fill="#ffffff" stroke="#555"/><text x="1030" y="66">Redis</text>
    <text x="1030" y="81" font-weight="normal" fill="#555">orders:&lt;sid&gt;</text>
  </g>
  <g stroke="#555" stroke-dasharray="4 4">
    <line x1="90" y1="88" x2="90" y2="995"/><line x1="280" y1="88" x2="280" y2="995"/><line x1="480" y1="88" x2="480" y2="995"/><line x1="670" y1="88" x2="670" y2="995"/><line x1="870" y1="88" x2="870" y2="995"/><line x1="1030" y1="88" x2="1030" y2="995"/>
  </g>

  <!-- A: api persists then posts -->
  <rect x="10" y="100" width="1080" height="95" fill="none" stroke="#3b6ea8" stroke-dasharray="6 4"/>
  <rect x="10" y="100" width="260" height="20" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="20" y="114" font-weight="bold" fill="#222">Submit, execution_mode = "live"</text>
  <line x1="90" y1="145" x2="870" y2="145" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="560" y="139" text-anchor="middle" fill="#222" class="h">INSERT trade_structure (submitted) + trade_order legs (pending, limit_price)</text>
  <line x1="90" y1="178" x2="280" y2="178" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="185" y="172" text-anchor="middle" fill="#222">POST /internal/structure/submit</text>
  <text x="295" y="182" fill="#555">require_ready: 503 until the session pass ran</text>

  <!-- B: placement -->
  <rect x="10" y="210" width="1080" height="355" fill="none" stroke="#d9480f" stroke-dasharray="6 4"/>
  <rect x="10" y="210" width="290" height="20" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="20" y="224" font-weight="bold" fill="#222">submit_structure_live (synchronous)</text>
  <line x1="280" y1="255" x2="870" y2="255" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="575" y="249" text-anchor="middle" fill="#222" class="h">claim: UPDATE submit_claimed_at WHERE NULL, commit (a replay gets 409)</text>
  <line x1="280" y1="285" x2="480" y2="285" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="380" y="279" text-anchor="middle" fill="#222">qualifyContracts, live quote</text>
  <rect x="295" y="297" width="560" height="40" rx="3" fill="#fff3cd" stroke="#b7791f"/>
  <text x="575" y="313" text-anchor="middle" fill="#222">pre-placement gate on EVERY leg: symbol allow-list + price collar vs preview</text>
  <text x="575" y="329" text-anchor="middle" fill="#222">a failure here places nothing: claim released, 400</text>

  <rect x="200" y="350" width="880" height="160" fill="none" stroke="#555" stroke-dasharray="4 3"/>
  <rect x="200" y="350" width="120" height="20" fill="#ffffff" stroke="#555"/>
  <text x="210" y="364" font-weight="bold" fill="#222">loop per leg</text>
  <line x1="280" y1="395" x2="480" y2="395" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="380" y="389" text-anchor="middle" fill="#d9480f">placeOrder(LMT, orderRef)</text>
  <text x="495" y="399" fill="#555" class="h">orderRef = fxvol:&lt;sid&gt;:&lt;oid&gt;</text>
  <line x1="280" y1="435" x2="870" y2="435" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="575" y="429" text-anchor="middle" fill="#222" class="h">ib_order_id, state = submitted, commit (per leg: the DB never lags IB)</text>
  <line x1="280" y1="470" x2="670" y2="470" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="475" y="464" text-anchor="middle" fill="#222" class="h">attach_fill_handlers(trade, order_id)</text>
  <text x="215" y="498" fill="#b02a37" class="h">leg k throws: legs 1..k-1 stay live and committed, structure → partial_fail</text>
  <line x1="280" y1="545" x2="90" y2="545" stroke="#555" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="185" y="539" text-anchor="middle" fill="#555">200 n_orders_placed</text>
  <text x="295" y="549" fill="#555" class="h">the final state arrives by events, not by this reply</text>

  <!-- C: async events -->
  <rect x="10" y="580" width="1080" height="410" fill="none" stroke="#146c43" stroke-dasharray="6 4"/>
  <rect x="10" y="580" width="330" height="20" fill="#d1e7dd" stroke="#146c43"/>
  <text x="20" y="594" font-weight="bold" fill="#222">later, on the IB event loop (asynchronous)</text>
  <line x1="480" y1="625" x2="670" y2="625" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="575" y="619" text-anchor="middle" fill="#222">statusEvent: Submitted</text>
  <line x1="670" y1="652" x2="870" y2="652" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="646" text-anchor="middle" fill="#222">next_state(): ack, audit</text>

  <line x1="480" y1="690" x2="670" y2="690" stroke="#146c43" stroke-width="1.5" marker-end="url(#ag)"/>
  <text x="575" y="684" text-anchor="middle" fill="#146c43">fillEvent: execId, qty, px</text>
  <line x1="670" y1="720" x2="870" y2="720" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="714" text-anchor="middle" fill="#222">execId seen? skip</text>
  <line x1="670" y1="750" x2="870" y2="750" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="744" text-anchor="middle" fill="#222">INSERT trade_fill</text>
  <line x1="670" y1="780" x2="870" y2="780" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="774" text-anchor="middle" fill="#222">partially_filled | filled</text>
  <line x1="670" y1="810" x2="870" y2="810" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="804" text-anchor="middle" fill="#222">rebuild_leg, commit</text>
  <text x="885" y="814" fill="#555">leg_position</text>
  <line x1="670" y1="840" x2="1030" y2="840" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="850" y="834" text-anchor="middle" fill="#222" class="h">PUBLISH order_filled / order_partial_fill</text>
  <line x1="480" y1="872" x2="670" y2="872" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="575" y="866" text-anchor="middle" fill="#222">commissionReportEvent</text>
  <line x1="670" y1="872" x2="870" y2="872" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="866" text-anchor="middle" fill="#222">commission_usd</text>

  <rect x="580" y="890" width="500" height="90" fill="none" stroke="#555" stroke-dasharray="4 3"/>
  <rect x="580" y="890" width="370" height="20" fill="#ffffff" stroke="#555"/>
  <text x="590" y="904" font-weight="bold" fill="#222">all entry legs filled: maybe_complete_structure</text>
  <line x1="670" y1="935" x2="870" y2="935" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="770" y="929" text-anchor="middle" fill="#222">fully_filled</text>
  <text x="885" y="939" fill="#555">+ booked_position</text>
  <line x1="670" y1="965" x2="1030" y2="965" stroke="#555" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="850" y="959" text-anchor="middle" fill="#222" class="h">PUBLISH structure_filled</text>
</svg>
