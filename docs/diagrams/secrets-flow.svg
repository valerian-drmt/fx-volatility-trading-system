<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="650" fill="#ffffff"/>
  <defs>
    <marker id="m-hot" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d9480f"/></marker>
    <marker id="s-hot" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#d9480f"/></marker>
    <marker id="m-cold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b6ea8"/></marker>
    <marker id="s-cold" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#3b6ea8"/></marker>
    <marker id="m-shared" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b7791f"/></marker>
    <marker id="s-shared" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#b7791f"/></marker>
    <marker id="m-fail" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b02a37"/></marker>
    <marker id="s-fail" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#b02a37"/></marker>
    <marker id="m-ok" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#146c43"/></marker>
    <marker id="s-ok" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#146c43"/></marker>
    <marker id="m-neutral" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker>
    <marker id="s-neutral" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#555555"/></marker>
    <marker id="m-grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker>
    <marker id="s-grey" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#555555"/></marker>
  </defs>
  <text x="550" y="30" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">A secret goes from Parameter Store to a container's RAM on the host's own role, never through GitHub</text>
  <text x="550" y="50" font-size="12" fill="#555" text-anchor="middle">names and paths only; amber = holds secret values, blue = never sees one</text>
  <rect x="30" y="75" width="230" height="70" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="145" y="99" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">operator</text>
  <text x="145" y="115" font-size="12" fill="#555" text-anchor="middle">AWS console, Parameter Store</text>
  <text x="145" y="131" font-size="12" fill="#555" text-anchor="middle">the only write path</text>
  <path d="M260,110 L378,110" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#m-neutral)"/>
  <rect x="283" y="92" width="72" height="16" fill="#ffffff"/>
  <text x="319" y="103" font-size="12" fill="#222" text-anchor="middle">put / edit</text>
  <rect x="380" y="70" width="320" height="80" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="540" y="99" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">SSM Parameter Store</text>
  <text x="540" y="115" font-size="12" fill="#555" text-anchor="middle">/fxvol/prod/*</text>
  <text x="540" y="131" font-size="12" fill="#555" text-anchor="middle">SecureString, KMS-encrypted</text>
  <rect x="790" y="70" width="290" height="80" rx="6" fill="#dbe6f4" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="935" y="98" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">GitHub Actions deploy-prod</text>
  <text x="935" y="114" font-size="12" fill="#555" text-anchor="middle">OIDC role: S3 put, SendCommand</text>
  <text x="935" y="130" font-size="12" fill="#555" text-anchor="middle">no ssm:GetParameter</text>
  <path d="M935,150 L935,223" fill="none" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#m-cold)"/>
  <rect x="757" y="159" width="171" height="16" fill="#ffffff"/>
  <text x="925" y="170" font-size="12" fill="#3b6ea8" text-anchor="end">send-command (no secret):</text>
  <rect x="810" y="174" width="118" height="16" fill="#ffffff"/>
  <text x="925" y="185" font-size="12" fill="#3b6ea8" text-anchor="end">IMAGE_TAG, OWNER,</text>
  <rect x="717" y="189" width="211" height="16" fill="#ffffff"/>
  <text x="925" y="200" font-size="12" fill="#3b6ea8" text-anchor="end">COMPOSE_PROFILES, READ_ONLY_API</text>
  <rect x="720" y="225" width="360" height="90" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="900" y="250" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">EC2 host: remote-deploy.sh</text>
  <text x="900" y="266" font-size="12" fill="#555" text-anchor="middle">ssm get-parameter --with-decryption</text>
  <text x="900" y="282" font-size="12" fill="#555" text-anchor="middle">instance role fxvol-ec2-secrets-role:</text>
  <text x="900" y="298" font-size="12" fill="#555" text-anchor="middle">ssm:GetParameter + kms:Decrypt</text>
  <path d="M650,150 L650,270 L718,270" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="652" y="252" width="52" height="16" fill="#ffffff"/>
  <text x="678" y="263" font-size="12" fill="#b7791f" text-anchor="middle">decrypt</text>
  <path d="M900,315 L900,368" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="907" y="335" width="65" height="16" fill="#ffffff"/>
  <text x="910" y="346" font-size="12" fill="#b7791f">umask 077</text>
  <rect x="720" y="370" width="360" height="70" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="900" y="401" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">/opt/fxvol/.env  (mode 0600)</text>
  <text x="900" y="417" font-size="12" fill="#555" text-anchor="middle">the one rendered file, rewritten each deploy</text>
  <path d="M900,440 L900,493" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="907" y="460" width="184" height="16" fill="#ffffff"/>
  <text x="910" y="471" font-size="12" fill="#b7791f">compose interpolates ${VAR}</text>
  <rect x="720" y="495" width="360" height="70" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="900" y="526" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">prod containers</text>
  <text x="900" y="542" font-size="12" fill="#555" text-anchor="middle">process environment, in RAM</text>
  <rect x="360" y="360" width="320" height="205" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="520" y="395" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">what the host renders</text>
  <text x="520" y="411" font-size="12" fill="#555" text-anchor="middle">always: DB_PASSWORD, REDIS_PASSWORD</text>
  <text x="520" y="427" font-size="12" fill="#555" text-anchor="middle">(deploy refuses without REDIS_PASSWORD)</text>
  <text x="520" y="443" font-size="12" fill="#555" text-anchor="middle">AUTH_SECRET / _HASH / _SALT when set</text>
  <text x="520" y="459" font-size="12" fill="#555" text-anchor="middle">EXECUTION_INTERNAL_TOKEN, else</text>
  <text x="520" y="475" font-size="12" fill="#555" text-anchor="middle">/etc/fxvol/internal_token (root 0600)</text>
  <text x="520" y="491" font-size="12" fill="#555" text-anchor="middle">profile ib: IB_USERID, IB_PASSWORD,</text>
  <text x="520" y="507" font-size="12" fill="#555" text-anchor="middle">VNC_PASSWORD</text>
  <text x="520" y="523" font-size="12" fill="#555" text-anchor="middle">profile obs: GRAFANA_ADMIN_PASSWORD</text>
  <text x="520" y="539" font-size="12" fill="#555" text-anchor="middle">(deploy refuses obs without it)</text>
  <path d="M680,405 L718,405" fill="none" stroke="#555555" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#m-neutral)"/>
  <path d="M440,150 L440,200 L165,200 L165,223" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="191" y="182" width="217" height="16" fill="#ffffff"/>
  <text x="300" y="193" font-size="12" fill="#b7791f" text-anchor="middle">get-parameters --with-decryption</text>
  <rect x="30" y="225" width="270" height="90" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="165" y="258" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">laptop: load_secrets.ps1</text>
  <text x="165" y="274" font-size="12" fill="#555" text-anchor="middle">user-run only</text>
  <text x="165" y="290" font-size="12" fill="#555" text-anchor="middle">profile fxvol-dev (MFA)</text>
  <path d="M165,315 L165,368" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="30" y="370" width="270" height="70" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="165" y="401" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">PowerShell session env</text>
  <text x="165" y="417" font-size="12" fill="#555" text-anchor="middle">RAM only, gone with the shell</text>
  <path d="M165,440 L165,493" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="172" y="460" width="65" height="16" fill="#ffffff"/>
  <text x="175" y="471" font-size="12" fill="#b7791f">inherited</text>
  <rect x="30" y="495" width="270" height="70" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="165" y="526" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">local compose stack</text>
  <text x="165" y="542" font-size="12" fill="#555" text-anchor="middle">process environment, in RAM</text>
  <text x="30" y="600" font-size="12" fill="#555">Host manual work: scripts/aws/load_secrets.sh renders /run/fxvol.env (tmpfs, root:fxvol 0640). Presence checks print a</text>
  <text x="30" y="618" font-size="12" fill="#555">length or a parameter name, never a value; docker inspect Config.Env is off limits (docs/ops/secrets.md).</text>
</svg>
