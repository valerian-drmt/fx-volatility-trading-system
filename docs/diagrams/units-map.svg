  <text x="550.0" y="30" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Which unit at which layer: points at IB, fractions on the surface, dollars in the desk</text>
  <text x="110.0" y="70" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Market</text>
  <text x="330.0" y="70" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Surface</text>
  <text x="550.0" y="70" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Kernel</text>
  <text x="770.0" y="70" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Desk units</text>
  <text x="990.0" y="70" font-size="12" fill="#555" text-anchor="middle" font-weight="bold">Consumers</text>
  <rect x="20" y="90" width="180" height="110" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="110.0" y="116.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">IB chain and quotes</text>
  <text x="110.0" y="132.0" font-size="12" fill="#222" text-anchor="middle">option price: price pts</text>
  <text x="110.0" y="148.0" font-size="12" fill="#222" text-anchor="middle">delta: call-delta [0, 1]</text>
  <text x="110.0" y="164.0" font-size="12" fill="#222" text-anchor="middle">put: 1 + δ_put</text>
  <text x="110.0" y="180.0" font-size="12" fill="#222" text-anchor="middle">6E future: USD per EUR</text>
  <rect x="240" y="90" width="180" height="110" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="330.0" y="116.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Surface payload (Redis)</text>
  <text x="330.0" y="132.0" font-size="12" fill="#222" text-anchor="middle">cell iv: fraction 0.0605</text>
  <text x="330.0" y="148.0" font-size="12" fill="#222" text-anchor="middle">cell strike: price pts</text>
  <text x="330.0" y="164.0" font-size="12" fill="#222" text-anchor="middle">_rv_full_pct, rv_pct,</text>
  <text x="330.0" y="180.0" font-size="12" fill="#222" text-anchor="middle">_har, _garch, _fair_q: %</text>
  <rect x="460" y="90" width="180" height="142" rx="6" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.4"/>
  <text x="550.0" y="108.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">core.pricing.bs</text>
  <text x="550.0" y="124.0" font-size="12" fill="#222" text-anchor="middle">F, K: price points</text>
  <text x="550.0" y="140.0" font-size="12" fill="#222" text-anchor="middle">T: years = dte / 365</text>
  <text x="550.0" y="156.0" font-size="12" fill="#222" text-anchor="middle">σ: fraction</text>
  <text x="550.0" y="172.0" font-size="12" fill="#222" text-anchor="middle">price: price points</text>
  <text x="550.0" y="188.0" font-size="12" fill="#222" text-anchor="middle">bs_theta: per day</text>
  <text x="550.0" y="204.0" font-size="12" fill="#222" text-anchor="middle">bs_greeks theta: per year</text>
  <text x="550.0" y="220.0" font-size="12" fill="#222" text-anchor="middle">bs_vega: per 1.00 of σ</text>
  <rect x="680" y="90" width="180" height="126" rx="6" fill="#d1e7dd" stroke="#146c43" stroke-width="1.4"/>
  <text x="770.0" y="108.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Preview (core.units)</text>
  <text x="770.0" y="124.0" font-size="12" fill="#222" text-anchor="middle">premium: pts × 125 000</text>
  <text x="770.0" y="140.0" font-size="12" fill="#222" text-anchor="middle">vega × 0.01: $ / vol pt</text>
  <text x="770.0" y="156.0" font-size="12" fill="#222" text-anchor="middle">gamma × 1e-8: $ / pip²</text>
  <text x="770.0" y="172.0" font-size="12" fill="#222" text-anchor="middle">theta ÷ 365: $ / day</text>
  <text x="770.0" y="188.0" font-size="12" fill="#222" text-anchor="middle">delta × F: USD exposure</text>
  <text x="770.0" y="204.0" font-size="12" fill="#222" text-anchor="middle">greeks_net, per unit</text>
  <rect x="900" y="90" width="180" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="990.0" y="116.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Order to IB</text>
  <text x="990.0" y="132.0" font-size="12" fill="#222" text-anchor="middle">preview_price =</text>
  <text x="990.0" y="148.0" font-size="12" fill="#222" text-anchor="middle">USD ÷ 125 000 = pts</text>
  <text x="990.0" y="164.0" font-size="12" fill="#222" text-anchor="middle">lmtPrice, fills: pts</text>
  <text x="990.0" y="180.0" font-size="12" fill="#222" text-anchor="middle">LMT = pts × (1 ± 0.25)</text>
  <rect x="240" y="290" width="180" height="126" rx="6" fill="#dbe6f4" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="330.0" y="308.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Models on the surface</text>
  <text x="330.0" y="324.0" font-size="12" fill="#222" text-anchor="middle">SVI: k = ln(K/F)</text>
  <text x="330.0" y="340.0" font-size="12" fill="#222" text-anchor="middle">w = σ² T, T in years</text>
  <text x="330.0" y="356.0" font-size="12" fill="#222" text-anchor="middle">tenors: calendar days</text>
  <text x="330.0" y="372.0" font-size="12" fill="#222" text-anchor="middle">YZ, HAR, GARCH: annual %</text>
  <text x="330.0" y="388.0" font-size="12" fill="#222" text-anchor="middle">VRP: additive vol pts</text>
  <text x="330.0" y="404.0" font-size="12" fill="#222" text-anchor="middle">PCA, regime: %, z</text>
  <rect x="680" y="290" width="180" height="142" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="770.0" y="308.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">open_position (risk)</text>
  <text x="770.0" y="324.0" font-size="12" fill="#222" text-anchor="middle">greek_scaling, mult in EUR</text>
  <text x="770.0" y="340.0" font-size="12" fill="#222" text-anchor="middle">delta_eur = δ × qty × mult</text>
  <text x="770.0" y="356.0" font-size="12" fill="#222" text-anchor="middle">delta_usd = delta_eur × F</text>
  <text x="770.0" y="372.0" font-size="12" fill="#222" text-anchor="middle">gamma_usd × 1e-4: $ / pip</text>
  <text x="770.0" y="388.0" font-size="12" fill="#222" text-anchor="middle">vega_usd × 0.01: $ / vol pt</text>
  <text x="770.0" y="404.0" font-size="12" fill="#222" text-anchor="middle">theta_usd: $ / day</text>
  <text x="770.0" y="420.0" font-size="12" fill="#222" text-anchor="middle">volga × 0.01²: $ / vol pt²</text>
  <rect x="900" y="290" width="180" height="142" rx="6" fill="#f8d7da" stroke="#b02a37" stroke-width="1.4"/>
  <text x="990.0" y="308.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">Pre-trade gate</text>
  <text x="990.0" y="324.0" font-size="12" fill="#222" text-anchor="middle">book: open_position sums</text>
  <text x="990.0" y="340.0" font-size="12" fill="#222" text-anchor="middle">trade gamma: ÷ 1e-4</text>
  <text x="990.0" y="356.0" font-size="12" fill="#222" text-anchor="middle">→ $ / pip, matches</text>
  <text x="990.0" y="372.0" font-size="12" fill="#222" text-anchor="middle">trade delta_unhedged read</text>
  <text x="990.0" y="388.0" font-size="12" fill="#222" text-anchor="middle">as contracts × 125 000 × F,</text>
  <text x="990.0" y="404.0" font-size="12" fill="#222" text-anchor="middle">but it is already USD:</text>
  <text x="990.0" y="420.0" font-size="12" fill="#222" text-anchor="middle">scaled twice</text>
