  <line x1="860" y1="360" x2="898" y2="360" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M840,216 V252 H990.0 V288" fill="none" stroke="#b02a37" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="998.0" y="274" font-size="12" fill="#b02a37" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">greeks_net</text>
  <text x="550" y="462" font-size="12" fill="#555" text-anchor="middle">mult = 125 000 EUR for 6E and EUU options, 12 500 for M6E · PIP_SIZE = 1e-4 · VOLPT = 0.01 (core.units)</text>
  <text x="550" y="482" font-size="12" fill="#555" text-anchor="middle">Leg IV crosses the surface → kernel boundary as entry_iv_pct = iv × 100, then σ = entry_iv_pct ÷ 100</text>
