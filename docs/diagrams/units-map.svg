  <line x1="420" y1="145" x2="458" y2="145" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="440" y="138" font-size="12" fill="#555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">× 100</text>
  <text x="440" y="166" font-size="12" fill="#555" text-anchor="middle" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">÷ 100</text>
