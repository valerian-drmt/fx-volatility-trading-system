<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="600" fill="#ffffff"/>
  <defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#555555"/></marker><marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b02a37"/></marker><marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#146c43"/></marker><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d9480f"/></marker><marker id="ac" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b6ea8"/></marker><marker id="ay" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b7791f"/></marker></defs>
  <text x="550.0" y="30" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">Fair vol is Yang-Zhang RV plus the VRP; HAR and GARCH ride along as diagnostics</text>
  <rect x="30" y="120" width="190" height="56" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="125.0" y="143.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">daily OHLC bars</text>
  <text x="125.0" y="159.0" font-size="12" fill="#222" text-anchor="middle">_fetch_ohlc()</text>
  <line x1="125" y1="176" x2="125" y2="208" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="30" y="210" width="190" height="96" rx="6" fill="#f4f5f7" stroke="#555555" stroke-width="1.4"/>
  <text x="125.0" y="230" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">_ohlc_signature</text>
  <text x="125.0" y="246" font-size="12" fill="#222" text-anchor="middle">(last bar date, length)</text>
  <text x="125.0" y="262" font-size="12" fill="#222" text-anchor="middle">same bar: reuse the</text>
  <text x="125.0" y="278" font-size="12" fill="#222" text-anchor="middle">cached block, no refit</text>
  <rect x="250" y="90" width="340" height="440" fill="none" stroke="#555555" stroke-dasharray="6 4"/>
  <rect x="250" y="90" width="340" height="22" rx="0" fill="#f4f5f7" stroke="#555555" stroke-width="1.4"/>
  <text x="420.0" y="104.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">_compute_fair_vol_block · new bar only</text>
  <rect x="270" y="125" width="300" height="60" rx="6" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.4"/>
  <text x="420.0" y="150.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">yang_zhang_rv_pct (all rows)</text>
  <text x="420.0" y="166.0" font-size="12" fill="#222" text-anchor="middle">→ _rv_full_pct</text>
  <rect x="270" y="200" width="300" height="76" rx="6" fill="#fbe3d6" stroke="#d9480f" stroke-width="1.4"/>
  <text x="420.0" y="225.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">yang_zhang_rv_pct per tenor</text>
  <text x="420.0" y="241.0" font-size="12" fill="#222" text-anchor="middle">window = max(3, round(T × 252))</text>
  <text x="420.0" y="257.0" font-size="12" fill="#222" text-anchor="middle">→ pillar rv_pct (1M ≈ 21, 3M ≈ 63 rows)</text>
  <rect x="270" y="292" width="300" height="112" rx="6" fill="#dbe6f4" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="420.0" y="311.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">fit_and_project_garch (≥ 5 closes)</text>
  <text x="420.0" y="327.0" font-size="12" fill="#222" text-anchor="middle">GARCH(1,1) via arch, normal errors</text>
  <text x="420.0" y="343.0" font-size="12" fill="#222" text-anchor="middle">average variance over [0, T]</text>
  <text x="420.0" y="359.0" font-size="12" fill="#222" text-anchor="middle">blend 0.5 with empirical leg, κ = 2.0</text>
  <text x="420.0" y="375.0" font-size="12" fill="#222" text-anchor="middle">not converged: empirical leg only</text>
  <text x="420.0" y="391.0" font-size="12" fill="#222" text-anchor="middle">→ _garch {sigma_model_pct}</text>
  <rect x="270" y="420" width="300" height="94" rx="6" fill="#dbe6f4" stroke="#3b6ea8" stroke-width="1.4"/>
  <text x="420.0" y="446.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">fit_and_project_har (≥ 45 closes)</text>
  <text x="420.0" y="462.0" font-size="12" fill="#222" text-anchor="middle">OLS on log-RV, lags 1 / 5 / 22 days</text>
  <text x="420.0" y="478.0" font-size="12" fill="#222" text-anchor="middle">calendar → trading days × 5/7</text>
  <text x="420.0" y="494.0" font-size="12" fill="#222" text-anchor="middle">→ _har {sigma_har_pct}</text>
  <text x="420" y="548" font-size="12" fill="#555" text-anchor="middle">runs in asyncio.to_thread, off the event loop</text>
  <line x1="220" y1="148" x2="238" y2="148" stroke="#555555" stroke-width="1.4"/>
  <line x1="238" y1="148" x2="238" y2="467" stroke="#555555" stroke-width="1.4"/>
  <line x1="238" y1="155" x2="268" y2="155" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="238" y1="238" x2="268" y2="238" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="238" y1="348" x2="268" y2="348" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="238" y1="467" x2="268" y2="467" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="620" y="90" width="240" height="440" fill="none" stroke="#555555" stroke-dasharray="6 4"/>
  <rect x="620" y="90" width="240" height="22" rx="0" fill="#f4f5f7" stroke="#555555" stroke-width="1.4"/>
  <text x="740.0" y="104.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">build_fair_q · every cycle</text>
  <rect x="635" y="125" width="210" height="110" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="740.0" y="151.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">sigma_fair_p per tenor</text>
  <text x="740.0" y="167.0" font-size="12" fill="#222" text-anchor="middle">1. rv_tenor: pillar rv_pct</text>
  <text x="740.0" y="183.0" font-size="12" fill="#222" text-anchor="middle">2. rv_full: _rv_full_pct</text>
  <text x="740.0" y="199.0" font-size="12" fill="#222" text-anchor="middle">3. har, then garch</text>
  <text x="740.0" y="215.0" font-size="12" fill="#222" text-anchor="middle">(only when no RV at all)</text>
  <rect x="635" y="265" width="210" height="94" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="740.0" y="291.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">q_measure_from_p</text>
  <text x="740.0" y="307.0" font-size="12" fill="#222" text-anchor="middle">σQ = σP + VRP(tenor, regime)</text>
  <text x="740.0" y="323.0" font-size="12" fill="#222" text-anchor="middle">VRP_DEFAULTS_VOL_PTS</text>
  <text x="740.0" y="339.0" font-size="12" fill="#222" text-anchor="middle">unknown tenor: 0.8</text>
  <rect x="635" y="390" width="210" height="94" rx="6" fill="#ffffff" stroke="#555555" stroke-width="1.4"/>
  <text x="740.0" y="416.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">detect_regime</text>
  <text x="740.0" y="432.0" font-size="12" fill="#222" text-anchor="middle">vol_level = _rv_full_pct</text>
  <text x="740.0" y="448.0" font-size="12" fill="#222" text-anchor="middle">&gt; 10 → stressed, else calm</text>
  <text x="740.0" y="464.0" font-size="12" fill="#222" text-anchor="middle">(vol of vol None, slope unused)</text>
  <line x1="740" y1="235" x2="740" y2="263" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="740" y1="390" x2="740" y2="361" stroke="#555555" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="748" y="378" font-size="12" fill="#222" text-anchor="start" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">regime</text>
  <line x1="570" y1="150" x2="633" y2="150" stroke="#d9480f" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M570,172 H595 V437 H633" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#ah)"/>
  <line x1="570" y1="232" x2="633" y2="200" stroke="#d9480f" stroke-width="1.4" marker-end="url(#ah)"/>
  <path d="M570,467 H610 V348" fill="none" stroke="#3b6ea8" stroke-width="1.4" stroke-dasharray="6 4"/>
  <path d="M570,348 H610 V222 H633" fill="none" stroke="#3b6ea8" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ac)"/>
  <rect x="885" y="240" width="190" height="140" rx="6" fill="#d1e7dd" stroke="#146c43" stroke-width="1.4"/>
  <text x="980.0" y="273.0" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">_fair_q[tenor]</text>
  <text x="980.0" y="289.0" font-size="12" fill="#222" text-anchor="middle">sigma_fair_p_pct</text>
  <text x="980.0" y="305.0" font-size="12" fill="#222" text-anchor="middle">vrp_vol_pts</text>
  <text x="980.0" y="321.0" font-size="12" fill="#222" text-anchor="middle">sigma_fair_q_pct</text>
  <text x="980.0" y="337.0" font-size="12" fill="#222" text-anchor="middle">regime</text>
  <text x="980.0" y="353.0" font-size="12" fill="#222" text-anchor="middle">fair_source</text>
  <line x1="845" y1="312" x2="883" y2="312" stroke="#146c43" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="980" y="400" font-size="12" fill="#555" text-anchor="middle">published on the surface</text>
  <text x="980" y="416" font-size="12" fill="#555" text-anchor="middle">payload; all in percent,</text>
  <text x="980" y="432" font-size="12" fill="#555" text-anchor="middle">VRP in vol points</text>
  <line x1="40" y1="578" x2="80" y2="578" stroke="#d9480f" stroke-width="2"/>
  <text x="88" y="582" font-size="12" fill="#222" text-anchor="start">Yang-Zhang RV: the fair-value anchor</text>
  <line x1="360" y1="578" x2="400" y2="578" stroke="#3b6ea8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="408" y="582" font-size="12" fill="#222" text-anchor="start">HAR / GARCH (P-measure forecasts): diagnostics, last-resort fallback</text>
</svg>
