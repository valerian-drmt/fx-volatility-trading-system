<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="520" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6676"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b02a37"/></marker>
  </defs>
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2430">4 November 2026: polled cold scans fill the pool, the hot account read gets a 500</text>

  <!-- lifelines -->
  <g fill="#1d2430" font-weight="bold" text-anchor="middle">
    <rect x="60" y="50" width="160" height="34" rx="4" fill="#ffffff" stroke="#5b6676"/><text x="140" y="72">voldesk (N tabs)</text>
    <rect x="340" y="50" width="120" height="34" rx="4" fill="#ffffff" stroke="#5b6676"/><text x="400" y="72">api</text>
    <rect x="590" y="50" width="180" height="34" rx="4" fill="#fff3cd" stroke="#b7791f"/><text x="680" y="72">asyncpg pool · 15 slots</text>
    <rect x="900" y="50" width="140" height="34" rx="4" fill="#ffffff" stroke="#5b6676"/><text x="970" y="72">Postgres</text>
  </g>
  <g stroke="#5b6676" stroke-dasharray="4 4">
    <line x1="140" y1="84" x2="140" y2="500"/><line x1="400" y1="84" x2="400" y2="500"/><line x1="680" y1="84" x2="680" y2="500"/><line x1="970" y1="84" x2="970" y2="500"/>
  </g>

  <!-- loop box -->
  <rect x="100" y="100" width="940" height="170" fill="none" stroke="#3b6ea8" stroke-dasharray="6 4"/>
  <rect x="100" y="100" width="190" height="20" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="110" y="114" fill="#1d2430" font-size="11" font-weight="bold">loop · every 60 s · per open tab</text>

  <line x1="140" y1="140" x2="400" y2="140" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="270" y="134" text-anchor="middle" fill="#1d2430">GET /portfolio/pnl-attribution</text>
  <line x1="400" y1="170" x2="680" y2="170" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="540" y="164" text-anchor="middle" fill="#1d2430">acquire connection</text>
  <line x1="680" y1="200" x2="970" y2="200" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="825" y="194" text-anchor="middle" fill="#1d2430">DISTINCT ON over 1.28 M rows</text>
  <rect x="880" y="212" width="180" height="46" rx="3" fill="#fff3cd" stroke="#b7791f"/>
  <text x="970" y="230" text-anchor="middle" fill="#1d2430" font-size="11">work_mem 4 MB, spills to disk</text>
  <text x="970" y="246" text-anchor="middle" fill="#1d2430" font-size="11">1 to 8 min per call</text>

  <!-- pool saturated note -->
  <rect x="560" y="290" width="240" height="46" rx="3" fill="#fff3cd" stroke="#b7791f"/>
  <text x="680" y="308" text-anchor="middle" fill="#1d2430" font-size="11">13 to 21 copies in flight</text>
  <text x="680" y="324" text-anchor="middle" fill="#1d2430" font-size="11">all 15 slots held by cold scans</text>

  <!-- hot read -->
  <line x1="140" y1="370" x2="400" y2="370" stroke="#d9480f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="270" y="364" text-anchor="middle" fill="#d9480f">GET /portfolio/account (hot, needs 200 ms)</text>
  <line x1="400" y1="400" x2="680" y2="400" stroke="#d9480f" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="540" y="394" text-anchor="middle" fill="#d9480f">acquire connection</text>
  <line x1="680" y1="430" x2="400" y2="430" stroke="#b02a37" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#ar)"/>
  <text x="540" y="424" text-anchor="middle" fill="#b02a37">QueuePool limit of size 5 overflow 10 reached</text>
  <line x1="400" y1="460" x2="140" y2="460" stroke="#b02a37" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#ar)"/>
  <text x="270" y="454" text-anchor="middle" fill="#b02a37">500 Internal Server Error</text>
  <rect x="40" y="472" width="220" height="40" rx="3" fill="#f8d7da" stroke="#b02a37"/>
  <text x="150" y="488" text-anchor="middle" fill="#1d2430" font-size="11">Cash &amp; margin $0, indicators "no data"</text>
  <text x="150" y="503" text-anchor="middle" fill="#1d2430" font-size="11">while IB and Redis were fine</text>
</svg>
