  <path d="M550,387 L618,387" fill="none" stroke="#b02a37" stroke-width="1.5" marker-end="url(#m-fail)"/>
  <rect x="620" y="358" width="330" height="58" rx="6" fill="#f8d7da" stroke="#b02a37" stroke-width="1.4"/>
