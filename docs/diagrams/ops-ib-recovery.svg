  <rect x="570" y="480" width="230" height="70" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="685" y="503" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">docker restart 4 engines</text>
  <text x="685" y="519" font-size="12" fill="#555" text-anchor="middle">market-data, vol-engine,</text>
  <text x="685" y="535" font-size="12" fill="#555" text-anchor="middle">risk, execution</text>
  <path d="M800,515 L833,515" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="835" y="480" width="230" height="70" rx="6" fill="#fff3cd" stroke="#b7791f" stroke-width="1.4"/>
  <text x="950" y="503" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">check working orders</text>
  <text x="950" y="519" font-size="12" fill="#555" text-anchor="middle">order_reconcile_loop; a gap</text>
  <text x="950" y="535" font-size="12" fill="#555" text-anchor="middle">opens a break (alert 15 min)</text>
  <text x="40" y="584" font-size="12" fill="#555">Session exclusivity: one paper account, owned by prod. Stop ib-gateway before any portal or mobile login.</text>
