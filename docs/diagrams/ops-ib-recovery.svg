  <text x="785" y="327" font-size="12" fill="#555" text-anchor="middle">the watchdog acts every 2 min</text>
  <rect x="250" y="358" width="300" height="58" rx="6" fill="#f2f2f2" stroke="#555555" stroke-width="1.4"/>
  <text x="400" y="383" font-size="12" fill="#222" text-anchor="middle" font-weight="bold">bid/ask -1 on every contract,</text>
  <text x="400" y="399" font-size="12" fill="#555" text-anchor="middle">farms OK, no error code</text>
