  <text x="785" y="175" font-size="12" fill="#555" text-anchor="middle">copy the build into ib_gateway_jts (the</text>
  <text x="785" y="191" font-size="12" fill="#555" text-anchor="middle">deploy does it since #415); restart won't</text>
