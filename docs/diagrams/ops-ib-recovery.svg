  <text x="110" y="234" font-size="13" fill="#222" text-anchor="middle" font-weight="bold">IBSessionDown</text>
  <text x="110" y="250" font-size="12" fill="#555" text-anchor="middle">or the desk</text>
  <text x="110" y="266" font-size="12" fill="#555" text-anchor="middle">shows no quotes</text>
