  <text x="550" y="30" font-size="16" fill="#222" text-anchor="middle" font-weight="bold">IB triage: the signature picks the fix, and only two of the five are cured by a restart</text>
  <text x="550" y="50" font-size="12" fill="#555" text-anchor="middle">docs/ops/runbooks.md section 4; restart sequence = infrastructure/ec2/ib_watchdog.sh</text>
