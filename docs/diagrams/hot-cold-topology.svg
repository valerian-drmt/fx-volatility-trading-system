<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="640" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6676"/></marker>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d9480f"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b6ea8"/></marker>
  </defs>
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2430">Six engines, two paths: where each one writes and how the UI reads</text>

  <!-- legend -->
  <rect x="20" y="590" width="14" height="14" fill="#fbe3d6" stroke="#d9480f"/><text x="40" y="601" fill="#1d2430">hot path: orders, fills, positions, account, spot</text>
  <rect x="330" y="590" width="14" height="14" fill="#dbe6f4" stroke="#3b6ea8"/><text x="350" y="601" fill="#1d2430">cold path: surface, PCA, GMM, rollups, history</text>
  <rect x="640" y="590" width="14" height="14" fill="#fff3cd" stroke="#b7791f"/><text x="660" y="601" fill="#1d2430">shared by both paths with no priority rule</text>

  <!-- IB -->
  <rect x="30" y="250" width="130" height="160" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="95" y="322" text-anchor="middle" font-weight="bold" fill="#1d2430">IB Gateway</text>
  <text x="95" y="340" text-anchor="middle" fill="#5b6676" font-size="11">paper · 4 client ids</text>

  <!-- engines -->
  <rect x="250" y="70" width="180" height="56" rx="4" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="340" y="93" text-anchor="middle" font-weight="bold" fill="#1d2430">market-data (client 1)</text>
  <text x="340" y="111" text-anchor="middle" fill="#5b6676" font-size="11">ticks every 0.1 s</text>

  <rect x="250" y="150" width="180" height="56" rx="4" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="340" y="173" text-anchor="middle" font-weight="bold" fill="#1d2430">execution (client 5)</text>
  <text x="340" y="191" text-anchor="middle" fill="#5b6676" font-size="11">orders · fills · position sync 1 s</text>

  <rect x="250" y="230" width="180" height="56" rx="4" fill="#ffffff" stroke="#b7791f"/>
  <text x="340" y="253" text-anchor="middle" font-weight="bold" fill="#1d2430">risk (client 3)</text>
  <text x="340" y="271" text-anchor="middle" fill="#5b6676" font-size="11">greeks 2 s · history rows 30 s</text>

  <rect x="250" y="330" width="180" height="56" rx="4" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="340" y="353" text-anchor="middle" font-weight="bold" fill="#1d2430">vol (client 2)</text>
  <text x="340" y="371" text-anchor="middle" fill="#5b6676" font-size="11">chain 74 lines · surface ~3 min</text>

  <rect x="250" y="410" width="180" height="56" rx="4" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="340" y="433" text-anchor="middle" font-weight="bold" fill="#1d2430">analytics (no IB)</text>
  <text x="340" y="451" text-anchor="middle" fill="#5b6676" font-size="11">PCA · GMM · PC3 hourly</text>

  <rect x="250" y="490" width="180" height="56" rx="4" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="340" y="513" text-anchor="middle" font-weight="bold" fill="#1d2430">db-writer (no IB)</text>
  <text x="340" y="531" text-anchor="middle" fill="#5b6676" font-size="11">Redis db_events → Postgres batches</text>

  <!-- IB -> engines -->
  <line x1="160" y1="290" x2="250" y2="98" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="160" y1="310" x2="250" y2="178" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="160" y1="330" x2="250" y2="258" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="160" y1="350" x2="250" y2="358" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="170" y="283" fill="#d9480f" font-size="10">ticks</text>
  <text x="170" y="384" fill="#3b6ea8" font-size="10">chain</text>

  <!-- Redis, Postgres -->
  <rect x="540" y="110" width="160" height="120" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="620" y="162" text-anchor="middle" font-weight="bold" fill="#1d2430">Redis</text>
  <text x="620" y="180" text-anchor="middle" fill="#5b6676" font-size="11">last value + pub/sub</text>

  <rect x="540" y="370" width="160" height="160" rx="4" fill="#fff3cd" stroke="#b7791f" stroke-width="2"/>
  <text x="620" y="440" text-anchor="middle" font-weight="bold" fill="#1d2430">Postgres</text>
  <text x="620" y="458" text-anchor="middle" fill="#5b6676" font-size="11">one api pool (5 + 10)</text>
  <text x="620" y="474" text-anchor="middle" fill="#5b6676" font-size="11">1.3 M history rows</text>

  <!-- engines -> redis -->
  <line x1="430" y1="98" x2="540" y2="135" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="430" y1="178" x2="540" y2="160" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="430" y1="258" x2="540" y2="190" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="430" y1="358" x2="540" y2="220" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="470" y="108" fill="#d9480f" font-size="10">SET + PUBLISH ticks</text>
  <text x="470" y="166" fill="#d9480f" font-size="10">PUBLISH orders:*</text>
  <text x="470" y="236" fill="#5b6676" font-size="10">risk_update</text>
  <text x="470" y="320" fill="#3b6ea8" font-size="10">vol_update</text>

  <!-- engines -> postgres -->
  <line x1="430" y1="190" x2="540" y2="395" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="430" y1="275" x2="540" y2="420" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="430" y1="372" x2="540" y2="445" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/>
  <line x1="430" y1="438" x2="540" y2="470" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/>
  <line x1="430" y1="518" x2="540" y2="500" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="440" y="560" fill="#5b6676" font-size="10">open_position, account_history, open_position_history, surface, pca/gmm, streamed payloads</text>

  <!-- redis -> db-writer -->
  <polyline points="620,230 620,300 480,300 480,470" fill="none" stroke="#3b6ea8" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="480" y1="470" x2="432" y2="505" stroke="#3b6ea8" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#ac)"/>
  <text x="628" y="296" fill="#3b6ea8" font-size="10">db_events</text>

  <!-- api -->
  <rect x="800" y="250" width="130" height="160" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="865" y="322" text-anchor="middle" font-weight="bold" fill="#1d2430">api</text>
  <text x="865" y="340" text-anchor="middle" fill="#5b6676" font-size="11">REST + WS bridge</text>
  <line x1="700" y1="170" x2="800" y2="290" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="712" y="212" fill="#5b6676" font-size="10">pub/sub → WS</text>
  <line x1="700" y1="450" x2="800" y2="370" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="712" y="428" fill="#5b6676" font-size="10">queries</text>

  <!-- UI -->
  <rect x="990" y="250" width="90" height="160" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="1035" y="325" text-anchor="middle" font-weight="bold" fill="#1d2430">voldesk</text>
  <text x="1035" y="343" text-anchor="middle" fill="#5b6676" font-size="11">UI</text>
  <line x1="930" y1="280" x2="990" y2="280" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="960" y="272" text-anchor="middle" fill="#d9480f" font-size="10">WS ticks</text>
  <line x1="930" y1="315" x2="990" y2="315" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/>
  <text x="960" y="307" text-anchor="middle" fill="#3b6ea8" font-size="10">WS vol, risk</text>
  <line x1="990" y1="370" x2="930" y2="370" stroke="#5b6676" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#a)"/>
  <text x="960" y="362" text-anchor="middle" fill="#5b6676" font-size="10">REST poll</text>
  <text x="960" y="390" text-anchor="middle" fill="#5b6676" font-size="10">15 / 30 / 60 s</text>
  <text x="960" y="404" text-anchor="middle" fill="#5b6676" font-size="10">positions, orders,</text>
  <text x="960" y="418" text-anchor="middle" fill="#5b6676" font-size="10">account, portfolio</text>
</svg>
