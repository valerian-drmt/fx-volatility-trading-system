  <rect x="180" y="169" width="39" height="16" fill="#ffffff"/>
  <text x="200" y="180" font-size="12" fill="#d9480f" text-anchor="middle">HTTPS</text>
  <path d="M182,225 L218,225" fill="none" stroke="#d9480f" stroke-width="1.5" marker-end="url(#m-hot)"/>
  <path d="M390,125 L438,123" fill="none" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#m-cold)"/>
  <path d="M390,228 L438,228" fill="none" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#m-cold)"/>
  <rect x="375" y="209" width="79" height="16" fill="#ffffff"/>
  <text x="414" y="220" font-size="12" fill="#3b6ea8" text-anchor="middle">/api/, /ws/</text>
  <path d="M540,290 L540,328" fill="none" stroke="#b7791f" stroke-width="1.5" marker-end="url(#m-shared)"/>
  <rect x="547" y="303" width="39" height="16" fill="#ffffff"/>
  <text x="550" y="314" font-size="12" fill="#b7791f">token</text>
  <path d="M725,290 L725,328" fill="none" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#m-cold)"/>
  <path d="M660,478 L642,478" fill="none" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#m-cold)"/>
  <path d="M540,516 L540,573" fill="none" stroke="#b02a37" stroke-width="1.5" marker-end="url(#m-fail)"/>
  <rect x="547" y="539" width="59" height="16" fill="#ffffff"/>
  <text x="550" y="550" font-size="12" fill="#b02a37">ro mount</text>
  <path d="M900,305 L900,393" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#m-neutral)"/>
  <path d="M182,555 L300,555 L300,655 L1095,655 L1095,250 L1077,250" fill="none" stroke="#146c43" stroke-width="1.5" marker-end="url(#m-ok)"/>
  <rect x="498" y="637" width="283" height="16" fill="#ffffff"/>
  <text x="640" y="648" font-size="12" fill="#146c43" text-anchor="middle">SSM port forward / tunnel: no inbound port</text>
  <path d="M1095,250 L1095,140 L1077,140" fill="none" stroke="#146c43" stroke-width="1.5" marker-end="url(#m-ok)"/>
