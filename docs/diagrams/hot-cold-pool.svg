<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6676"/></marker>
  </defs>
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2430">The api connection pool: 200 ms reads queue behind 20 s scans, first come first served</text>

  <!-- hot queries -->
  <rect x="30" y="60" width="300" height="130" rx="4" fill="none" stroke="#d9480f" stroke-dasharray="6 4"/>
  <text x="40" y="78" fill="#d9480f" font-size="11" font-weight="bold">HOT QUERIES</text>
  <rect x="45" y="90" width="270" height="26" rx="3" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="55" y="107" fill="#1d2430">/portfolio/account</text><text x="305" y="107" text-anchor="end" fill="#1d2430">1 row · 0.2 s</text>
  <rect x="45" y="122" width="270" height="26" rx="3" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="55" y="139" fill="#1d2430">/positions/open</text><text x="305" y="139" text-anchor="end" fill="#1d2430">6 rows · 0.2 s</text>
  <rect x="45" y="154" width="270" height="26" rx="3" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="55" y="171" fill="#1d2430">/trade/spot-orders</text><text x="305" y="171" text-anchor="end" fill="#1d2430">30 rows · 0.2 s</text>

  <!-- cold queries -->
  <rect x="30" y="210" width="300" height="130" rx="4" fill="none" stroke="#3b6ea8" stroke-dasharray="6 4"/>
  <text x="40" y="228" fill="#3b6ea8" font-size="11" font-weight="bold">COLD QUERIES</text>
  <rect x="45" y="240" width="270" height="26" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="55" y="257" fill="#1d2430">/portfolio/pnl-attribution</text><text x="305" y="257" text-anchor="end" fill="#1d2430">history scan · 0.2 to 20 s</text>
  <rect x="45" y="272" width="270" height="26" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="55" y="289" fill="#1d2430">/portfolio/stats</text><text x="305" y="289" text-anchor="end" fill="#1d2430">account_history rollup · 5 s</text>
  <rect x="45" y="304" width="270" height="26" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="55" y="321" fill="#1d2430">/portfolio/daily-pnl</text><text x="305" y="321" text-anchor="end" fill="#1d2430">account_history rollup · 3 s</text>

  <!-- arrows to pool -->
  <line x1="330" y1="125" x2="470" y2="180" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="330" y1="275" x2="470" y2="220" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- pool: 15 slots -->
  <rect x="470" y="110" width="300" height="180" rx="4" fill="#fff3cd" stroke="#b7791f" stroke-width="2"/>
  <text x="620" y="132" text-anchor="middle" font-weight="bold" fill="#1d2430">api asyncpg pool</text>
  <text x="620" y="148" text-anchor="middle" fill="#5b6676" font-size="11">5 connections + 10 overflow · no priority</text>
  <g stroke="#b7791f" fill="#dbe6f4">
    <rect x="490" y="165" width="48" height="26"/><rect x="543" y="165" width="48" height="26"/><rect x="596" y="165" width="48" height="26"/><rect x="649" y="165" width="48" height="26"/><rect x="702" y="165" width="48" height="26"/>
    <rect x="490" y="196" width="48" height="26"/><rect x="543" y="196" width="48" height="26"/><rect x="596" y="196" width="48" height="26"/><rect x="649" y="196" width="48" height="26"/><rect x="702" y="196" width="48" height="26"/>
    <rect x="490" y="227" width="48" height="26"/><rect x="543" y="227" width="48" height="26"/><rect x="596" y="227" width="48" height="26"/><rect x="649" y="227" width="48" height="26" fill="#fbe3d6" stroke="#d9480f"/><rect x="702" y="227" width="48" height="26" fill="#ffffff"/>
  </g>
  <text x="620" y="276" text-anchor="middle" fill="#5b6676" font-size="11">13 slots held by cold scans · 1 hot read · 1 free: the next hot read waits</text>

  <!-- postgres -->
  <line x1="770" y1="200" x2="880" y2="200" stroke="#5b6676" stroke-width="1.2" marker-end="url(#a)"/>
  <rect x="880" y="140" width="190" height="120" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="975" y="192" text-anchor="middle" font-weight="bold" fill="#1d2430">Postgres</text>
  <text x="975" y="210" text-anchor="middle" fill="#5b6676" font-size="11">2 vCPU shared with</text>
  <text x="975" y="225" text-anchor="middle" fill="#5b6676" font-size="11">every other container</text>
</svg>
