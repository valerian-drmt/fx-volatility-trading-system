<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="440" fill="#ffffff"/>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d9480f"/></marker>
    <marker id="ac" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#3b6ea8"/></marker>
  </defs>
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2430">Target: the same engines in two lanes, with the new edges marked</text>

  <!-- hot lane -->
  <rect x="30" y="50" width="1040" height="170" rx="4" fill="none" stroke="#d9480f" stroke-dasharray="6 4"/>
  <text x="44" y="70" fill="#d9480f" font-size="11" font-weight="bold">HOT LANE · pushed end to end · cpu_shares 1024</text>
  <rect x="60" y="100" width="180" height="56" rx="4" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="150" y="123" text-anchor="middle" font-weight="bold" fill="#1d2430">execution</text><text x="150" y="141" text-anchor="middle" fill="#5b6676" font-size="11">after each sync / fill</text>
  <rect x="320" y="100" width="180" height="56" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="410" y="123" text-anchor="middle" font-weight="bold" fill="#1d2430">Redis pub/sub</text><text x="410" y="141" text-anchor="middle" fill="#5b6676" font-size="11">positions · account · orders:*</text>
  <rect x="580" y="100" width="180" height="56" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="670" y="123" text-anchor="middle" font-weight="bold" fill="#1d2430">api WS bridge</text><text x="670" y="141" text-anchor="middle" fill="#5b6676" font-size="11">already forwards these</text>
  <rect x="840" y="100" width="180" height="56" rx="4" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="930" y="123" text-anchor="middle" font-weight="bold" fill="#1d2430">UI</text><text x="930" y="141" text-anchor="middle" fill="#5b6676" font-size="11">patches rows in place</text>
  <line x1="240" y1="128" x2="320" y2="128" stroke="#d9480f" stroke-width="3" marker-end="url(#ah)"/><text x="280" y="118" text-anchor="middle" fill="#d9480f" font-size="10" font-weight="bold">NEW publish</text>
  <line x1="500" y1="128" x2="580" y2="128" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/><text x="540" y="118" text-anchor="middle" fill="#5b6676" font-size="10">exists</text>
  <line x1="760" y1="128" x2="840" y2="128" stroke="#d9480f" stroke-width="3" marker-end="url(#ah)"/><text x="800" y="118" text-anchor="middle" fill="#d9480f" font-size="10" font-weight="bold">NEW subscribe</text>
  <text x="550" y="190" text-anchor="middle" fill="#5b6676" font-size="11">click → IB ack → row changes on screen: target under 2 s, measured by a new histogram. REST poll kept as a 60 s reconciliation.</text>

  <!-- cold lane -->
  <rect x="30" y="240" width="1040" height="180" rx="4" fill="none" stroke="#3b6ea8" stroke-dasharray="6 4"/>
  <text x="44" y="260" fill="#3b6ea8" font-size="11" font-weight="bold">COLD LANE · computed once, read cheaply · cpu_shares 128 to 256</text>
  <rect x="60" y="290" width="180" height="56" rx="4" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="150" y="313" text-anchor="middle" font-weight="bold" fill="#1d2430">analytics</text><text x="150" y="331" text-anchor="middle" fill="#5b6676" font-size="11">PCA · GMM · rollups · attribution</text>
  <rect x="320" y="290" width="180" height="56" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="410" y="313" text-anchor="middle" font-weight="bold" fill="#1d2430">result tables</text><text x="410" y="331" text-anchor="middle" fill="#5b6676" font-size="11">one small row per cycle</text>
  <rect x="580" y="290" width="180" height="56" rx="4" fill="#ffffff" stroke="#5b6676"/>
  <text x="670" y="313" text-anchor="middle" font-weight="bold" fill="#1d2430">api</text><text x="670" y="331" text-anchor="middle" fill="#5b6676" font-size="11">SELECT … LIMIT 1</text>
  <rect x="840" y="290" width="180" height="56" rx="4" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="930" y="313" text-anchor="middle" font-weight="bold" fill="#1d2430">UI</text><text x="930" y="331" text-anchor="middle" fill="#5b6676" font-size="11">keeps last value + badge</text>
  <line x1="240" y1="318" x2="320" y2="318" stroke="#3b6ea8" stroke-width="3" marker-end="url(#ac)"/><text x="280" y="308" text-anchor="middle" fill="#3b6ea8" font-size="10" font-weight="bold">NEW write</text>
  <line x1="500" y1="318" x2="580" y2="318" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/><text x="540" y="308" text-anchor="middle" fill="#5b6676" font-size="10">ms read</text>
  <line x1="760" y1="318" x2="840" y2="318" stroke="#3b6ea8" stroke-width="1.5" marker-end="url(#ac)"/><text x="800" y="308" text-anchor="middle" fill="#5b6676" font-size="10">poll 60 s</text>
  <text x="550" y="380" text-anchor="middle" fill="#5b6676" font-size="11">The 1.3 M-row scans run inside the analytics cycle, on the throttled container, never inside a request.</text>
  <text x="550" y="398" text-anchor="middle" fill="#5b6676" font-size="11">A slow cycle delays a chart by a minute; it cannot touch the hot lane.</text>
</svg>
