<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect width="1100" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#5b6676"/></marker>
    <marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#d9480f"/></marker>
  </defs>
  <text x="550" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d2430">The write side: five writers and the maintenance they cause share the cores with the hot reads</text>

  <g>
    <rect x="30" y="60" width="230" height="44" rx="3" fill="#fbe3d6" stroke="#d9480f"/>
    <text x="145" y="78" text-anchor="middle" fill="#1d2430" font-weight="bold">execution</text><text x="145" y="94" text-anchor="middle" fill="#5b6676" font-size="11">open_position, account_history · 1 s when changed</text>
    <rect x="30" y="114" width="230" height="44" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
    <text x="145" y="132" text-anchor="middle" fill="#1d2430" font-weight="bold">risk</text><text x="145" y="148" text-anchor="middle" fill="#5b6676" font-size="11">open_position_history · N rows / 30 s</text>
    <rect x="30" y="168" width="230" height="44" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
    <text x="145" y="186" text-anchor="middle" fill="#1d2430" font-weight="bold">vol</text><text x="145" y="202" text-anchor="middle" fill="#5b6676" font-size="11">surface, fair vol · every 3 min</text>
    <rect x="30" y="222" width="230" height="44" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
    <text x="145" y="240" text-anchor="middle" fill="#1d2430" font-weight="bold">db-writer</text><text x="145" y="256" text-anchor="middle" fill="#5b6676" font-size="11">streamed payloads · batched</text>
    <rect x="30" y="276" width="230" height="44" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
    <text x="145" y="294" text-anchor="middle" fill="#1d2430" font-weight="bold">analytics</text><text x="145" y="310" text-anchor="middle" fill="#5b6676" font-size="11">pca, gmm, pc3 · hourly</text>
  </g>
  <g stroke="#5b6676" stroke-width="1.2">
    <line x1="260" y1="82" x2="440" y2="160" marker-end="url(#a)"/><line x1="260" y1="136" x2="440" y2="170" marker-end="url(#a)"/><line x1="260" y1="190" x2="440" y2="180" marker-end="url(#a)"/>
    <line x1="260" y1="244" x2="440" y2="190" marker-end="url(#a)"/><line x1="260" y1="298" x2="440" y2="200" marker-end="url(#a)"/>
  </g>

  <rect x="440" y="90" width="280" height="190" rx="4" fill="#fff3cd" stroke="#b7791f" stroke-width="2"/>
  <text x="580" y="116" text-anchor="middle" font-weight="bold" fill="#1d2430">Postgres · 2 vCPU</text>
  <text x="580" y="140" text-anchor="middle" fill="#1d2430" font-size="11">WAL + checkpoints</text>
  <text x="580" y="158" text-anchor="middle" fill="#1d2430" font-size="11">autovacuum after the 90-day retention delete</text>
  <text x="580" y="176" text-anchor="middle" fill="#1d2430" font-size="11">index maintenance on the 1.3 M-row table</text>
  <text x="580" y="212" text-anchor="middle" fill="#5b6676" font-size="11">busy for minutes with nothing of ours</text>
  <text x="580" y="228" text-anchor="middle" fill="#5b6676" font-size="11">visible in pg_stat_activity</text>

  <line x1="720" y1="185" x2="860" y2="185" stroke="#d9480f" stroke-width="1.5" marker-end="url(#ah)"/>
  <rect x="860" y="140" width="210" height="90" rx="3" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="965" y="166" text-anchor="middle" font-weight="bold" fill="#1d2430">hot reads</text>
  <text x="965" y="186" text-anchor="middle" fill="#1d2430" font-size="11">account · positions · spot orders</text>
  <text x="965" y="204" text-anchor="middle" fill="#1d2430" font-size="11">200 ms each, when the cores are free</text>
</svg>
