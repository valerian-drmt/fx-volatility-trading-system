  <text x="550" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">One bridge subscribes to every channel; each message reaches only the sockets of its channel</text>
  <text x="550" y="52" text-anchor="middle" fill="#555">bus/publisher.py  &#8594;  Redis pub/sub  &#8594;  api/ws/redis_bridge.py  &#8594;  api/ws/connection_manager.py  &#8594;  api/routers/ws.py  &#8594;  nginx  &#8594;  hooks/streams.ts</text>
  <text x="101" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Publisher</text>
  <text x="290" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Redis channel</text>
  <text x="550" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">api process</text>
  <text x="807" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">WebSocket</text>
  <text x="995" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#222">Desk reader</text>
