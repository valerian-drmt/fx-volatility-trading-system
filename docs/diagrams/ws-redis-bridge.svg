  <text x="475" y="152" text-anchor="middle" fill="#222">PSUBSCRIBE orders:*</text>
  <text x="627" y="122" text-anchor="middle" fill="#222" font-weight="bold">ConnectionManager</text>
  <text x="627" y="137" text-anchor="middle" fill="#222">channel &#8594; sockets</text>
  <text x="627" y="152" text-anchor="middle" fill="#222">broadcast(channel)</text>
