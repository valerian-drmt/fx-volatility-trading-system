  <rect x="40" y="583" width="22" height="14" rx="3" fill="#fbe3d6" stroke="#d9480f"/>
  <text x="70" y="594" fill="#222">hot path: an operator waits on it</text>
  <rect x="305" y="583" width="22" height="14" rx="3" fill="#dbe6f4" stroke="#3b6ea8"/>
  <text x="335" y="594" fill="#222">cold path: invalidation beat</text>
  <rect x="570" y="583" width="22" height="14" rx="3" fill="#ffffff" stroke="#555555" stroke-dasharray="5 3"/>
  <text x="600" y="594" fill="#222">no desk reader</text>
  <rect x="835" y="583" width="22" height="14" rx="3" fill="#f8d7da" stroke="#b02a37"/>
  <text x="865" y="594" fill="#222">forwarded but unserved</text>
  <rect x="16" y="616" width="348" height="46" rx="4" fill="#ffffff" stroke="#555555"/>
  <text x="28" y="635" fill="#222">Upgrade: Origin not on the allowlist</text>
  <text x="28" y="652" fill="#555">closes 1008 before accept; no Origin = accepted</text>
  <rect x="376" y="616" width="348" height="46" rx="4" fill="#ffffff" stroke="#555555"/>
  <text x="388" y="635" fill="#222">At most once: pub/sub keeps no backlog;</text>
  <text x="388" y="652" fill="#555">after a reconnect the desk re-reads REST</text>
  <rect x="736" y="616" width="348" height="46" rx="4" fill="#ffffff" stroke="#555555"/>
  <text x="748" y="635" fill="#222">Redis error: the bridge resubscribes after 2 s;</text>
  <text x="748" y="652" fill="#555">a failed send drops only that socket</text>
</svg>
