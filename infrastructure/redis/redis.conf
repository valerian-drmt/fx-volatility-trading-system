# Redis configuration for fxvol dev / prod.
# Mounted read-only into redis:7-alpine via docker-compose.
# Reference : releases/architecture_finale_project/09-redis.md

# Network
# bind 0.0.0.0 = the container's eth0 on fxvol-internal only (no host port in
# prod; dev publishes 127.0.0.1:6380). Auth comes from --requirepass, passed on
# the command line by docker-compose (REDIS_PASSWORD env) — never committed here.
bind 0.0.0.0
port 6379
protected-mode yes

# Memory — bounds growth. volatile-lru evicts only keys that carry a TTL;
# every key the services write today does (SET ... EX / EXPIRE), so under
# pressure Redis drops the oldest last-value cache entries and never a key
# someone forgot to expire. If a non-TTL key ever appears and memory fills,
# writes fail with OOM instead of silently losing state: that is the
# intended failure. Loss semantics: docs/ops/redis-durability.md (#343).
maxmemory 256mb
maxmemory-policy volatile-lru

# Persistence — RDB snapshots only. Everything in Redis is a cache of state
# that Postgres or the engines rebuild; what is lost on a restart and why it
# is acceptable is written down in docs/ops/redis-durability.md.
save 900 1
save 300 10
save 60 10000
appendonly no

# Logging
loglevel notice
logfile ""

# Slowlog — capture queries >10ms for ops visibility
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable commands that would let an attacker wipe the cache or rewrite
# the config from inside a compromised service. Renaming to the empty
# string makes them unreachable even for authenticated clients.
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG ""
