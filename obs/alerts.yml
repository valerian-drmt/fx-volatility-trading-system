# Prometheus alert rules (#342, audit 08#13). Evaluated by the obs-profile
# Prometheus, routed by Alertmanager to the SNS topic fxvol-alarms (email).
# Metric names: src/shared/observability.py (engines), cAdvisor (containers),
# src/api/routers/health.py (backup age). Runbook: docs/ops/alerting.md.
groups:
  - name: fxvol-trading-core
    rules:
      # A scrape target that disappears = the container is down or crash-looping
      # (Docker restarts an exited container; `up` flips 0/1 while it does).
      - alert: EngineDown
        expr: up{job="engines"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.instance }} not scraped for 2 min"
          description: "The container is down or restarting. `docker ps`, `docker logs <name> --tail 100` on the host."

      - alert: ApiDown
        expr: up{job="api"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: "api /metrics not scraped for 2 min"
          description: "nginx will answer 502. Check `docker logs fxvol-api` and /health/ready."

      # Alive but not working: the cycle loop stopped (IB hang, deadlock).
      # Thresholds = the container healthchecks (docker-compose.yml).
      - alert: EngineCycleStalled
        expr: |
          (time() - engine_last_cycle_timestamp_seconds{engine=~"market_data|risk_engine|execution_engine"} > 120)
          or (time() - engine_last_cycle_timestamp_seconds{engine=~"vol_engine|analytics_engine|db_writer"} > 600)
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.engine }} has not completed a cycle"
          description: "Heartbeat only proves the loop is scheduled; this proves it finished. See the IB watchdog log if IB-bound."

      - alert: IBSessionDown
        expr: min(ib_session_connected) == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "an engine's IB API session is disconnected"
          description: "Nightly IBC restart lasts ~2 min; longer = gateway dead, competing login, or 2FA. docs/execution/ib-integration.md."

      # Crash loop: a container restarted 3+ times in 15 min.
      - alert: ContainerCrashLoop
        expr: changes(container_start_time_seconds{name=~"fxvol-.+"}[15m]) >= 3
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.name }} restarted {{ $value }} times in 15 min"
          description: "OOM (check `docker inspect --format '{{.State.OOMKilled}}'`) or a boot error in `docker logs`."

      # db-writer: cycles stop when its Redis subscriber is down; frames published
      # meanwhile are lost (docs/ops/redis-durability.md). Tighter than the
      # generic stall rule because the loss is silent.
      - alert: DbWriterLag
        expr: time() - engine_last_cycle_timestamp_seconds{engine="db_writer"} > 180
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "db-writer has not written for 3 min"
          description: "Streamed history rows are being dropped. Check Redis and `docker logs fxvol-db-writer`."

      # Desk fluidity (#370): the two engine-side promises, p95 over 5 min.
      - alert: OrderSubmitSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(order_submit_latency_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "order submit p95 {{ $value | humanizeDuration }} (target 2 s)"
          description: "Click to IB Submitted is slow: IB session, execution engine CPU, or the api hop. Grafana 'Desk fluidity'."
      - alert: FillToPublishSlow
        expr: histogram_quantile(0.95, sum by (le) (rate(fill_to_publish_seconds_bucket[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "fill to publish p95 {{ $value | humanizeDuration }} (target 2 s)"
          description: "Fills reach the desk late: position sync interval, Postgres, or Redis. Grafana 'Desk fluidity'."

      # db-writer delivery (#324): a dropped frame is a hole in history, a dead
      # letter is a row that needs a human. Both used to be a log line.
      - alert: DbWriterDroppingFrames
        expr: increase(db_writer_queue_dropped_total[10m]) > 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "db-writer dropped {{ $value }} frames ({{ $labels.table }}) in 10 min"
          description: "Postgres is behind (long prune, locks, disk?). Check `db_writer_queue_depth` and `docker logs fxvol-db-writer`."
      - alert: DbWriterDeadLetters
        expr: increase(db_writer_dead_letter_total[1h]) > 0
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "db-writer parked {{ $value }} rows for {{ $labels.table }}"
          description: "`SELECT table_name, error, created_at FROM db_writer_dead_letter ORDER BY id DESC LIMIT 20` (docs/ops/redis-durability.md)."

      # Book vs broker (#323): a break that stays open means the desk's book and
      # IB disagree on a holding; 15 min rides out an in-flight fill.
      - alert: ReconciliationBreakOpen
        expr: max(reconciliation_breaks_open) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "{{ $value }} book-vs-broker reconciliation break(s) open for 15 min"
          description: "`GET /api/v1/positions/breaks` lists them; `docker logs fxvol-execution | grep reconciliation_break_opened` gives the contract, type and quantities."

      # Retention prune (#330): a table whose prune keeps failing grows without
      # bound; before this counter one blocked DELETE stopped both prunes silently.
      - alert: HistoryPruneFailing
        expr: increase(history_prune_failures_total[2d]) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "history prune failing on {{ $labels.table }} ({{ $labels.engine }})"
          description: "`docker logs fxvol-{{ $labels.engine }} | grep history_prune_failed`; the table keeps growing until fixed."

  # The order path (#495). Each rule has a firing test in obs/alerts_test.yml
  # (`promtool test rules`, run in CI): a rule nothing ever evaluated against
  # data is a rule nobody knows fires.
  - name: fxvol-orders
    rules:
      # A pending row is written by the api and placed by the engine within
      # seconds. The reaper ends one that never left after 5 min; past 10 the
      # reaper is not doing it either.
      - alert: OrderNeverPlaced
        expr: orders_oldest_waiting_seconds{state="pending"} > 600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "an order has been pending for {{ $value | humanizeDuration }}: it never left for the broker"
          description: "The reaper ends a pending row after 5 min; it did not. Runbook: docs/ops/runbooks.md section 6 (an order is stuck)."

      # Every order is DAY. A row still working 36 h after its submission
      # outlived the day it could fill in.
      - alert: OrderOutlivedItsDay
        expr: orders_oldest_waiting_seconds{state=~"submitted|partially_filled"} > 129600
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "an order has been {{ $labels.state }} for {{ $value | humanizeDuration }}: a DAY order ends with its day"
          description: "IB ended it and the book did not hear, or the book lost the order. Runbook: docs/ops/runbooks.md section 6 (an order is stuck)."

      # Three submits or more in an hour and none accepted. On 2026-11-13 the
      # gate refused every standard trade for a day before anyone counted.
      - alert: GateRefusingEverything
        expr: |
          sum(increase(order_gate_decisions_total{outcome="refused"}[1h])) >= 3
          unless
          sum(increase(order_gate_decisions_total{outcome="passed"}[1h])) > 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "the pre-trade gate refused all {{ $value | printf \"%.0f\" }} submits of the last hour"
          description: "Reasons: Grafana 'Desk fluidity', panel 'Submits refused, by reason', or `GET /api/v1/trade/refusals`. A stale surface, a halt left on or a limit typed too tight refuse everything."

      # The loops that follow an order to its end. Each stamps the time of its
      # last pass without an error; they run every minute.
      - alert: OrderLoopStalled
        expr: time() - order_loop_last_run_timestamp_seconds > 600
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "the {{ $labels.loop }} loop of the execution engine has not completed a pass for {{ $value | humanizeDuration }}"
          description: "Orders are no longer followed to their end by this loop. `docker logs fxvol-execution | grep -i {{ $labels.loop }}`; restart the engine if it does not recover. Runbook: docs/ops/runbooks.md section 6."

  - name: fxvol-host
    rules:
      # The host's root filesystem, measured by the api (one series). Not
      # cAdvisor's id="/": that is one series per device, and six small full
      # ones kept DiskUsageCritical firing for days at 64 % used (2026-11).
      # Disk fills were the cause of the 2026-07 deploy stalls.
      - alert: DiskUsageHigh
        expr: |
          fxvol_host_disk_used_bytes / fxvol_host_disk_total_bytes > 0.80
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "host disk above 80 %"
          description: "`docker system df`, `docker image prune -af`, `journalctl --disk-usage`. Deploys stall past ~95 %."

      - alert: DiskUsageCritical
        expr: |
          fxvol_host_disk_used_bytes / fxvol_host_disk_total_bytes > 0.90
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "host disk above 90 %"
          description: "Next deploy will fail. Prune now."

      # 26 h = nightly cron + slack (same threshold as /health/extended backup).
      - alert: BackupStale
        expr: fxvol_postgres_backup_age_seconds > 93600
        for: 30m
        labels: {severity: critical}
        annotations:
          summary: "last Postgres backup older than 26 h"
          description: "Cron /etc/cron.daily/fxvol-postgres-backup did not succeed. `tail /var/log/fxvol-postgres-backup.log`. RESTORE.md §5."

      - alert: BackupSignalMissing
        expr: absent(fxvol_postgres_backup_age_seconds)
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "no backup-age metric at all"
          description: "api not scraped or BACKUP_STATE_FILE unset on this deployment."

      - alert: MemoryNearLimit
        expr: |
          container_memory_working_set_bytes{name=~"fxvol-.+"} / container_spec_memory_limit_bytes{name=~"fxvol-.+"} > 0.90
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.name }} above 90 % of its memory cap"
          description: "An OOM kill follows. Raise the cap in docker-compose.yml or find the leak."
