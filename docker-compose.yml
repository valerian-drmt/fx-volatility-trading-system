# Production-like compose file. Ships the full v2 stack across three
# networks (public / internal / external) so downstream PRs can just
# attach new services (api, frontend, nginx, ib-gateway) without
# reworking the topology.
#
# For a host-side dev loop (uvicorn / vite on the host), put the host port
# mappings for postgres + redis in a docker-compose.override.yml (gitignored);
# compose merges it automatically. This file mirrors prod: no host port
# exposure by default.

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    container_name: fxvol-postgres
    mem_limit: 512m
    cpu_shares: 256
    restart: unless-stopped
    # Sized for a 512 MB container on the 3.8 GB host (#373, T9): buffers a
    # quarter of the limit, the planner told what the page cache can hold,
    # per-sort memory small (many pooled connections), vacuum memory generous
    # for the nightly batched prune, autovacuum woken often enough to keep the
    # two history tables (migration 063) flat. docs/architecture/database.md.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - autovacuum_naptime=30s
    environment:
      POSTGRES_DB: fxvol
      POSTGRES_USER: fxvol
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    # NOTE : jsonlog destination would write to a file, not stdout —
    # Docker stdout stays plain text by design in postgres:16-alpine.
    # Level extraction is done downstream in obs/alloy.alloy via a
    # regex stage matching the `[pid] SEVERITY:` pattern.
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    networks:
      - fxvol-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fxvol -d fxvol"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine3.22@sha256:acc6f0ac39f6fe3a39c57b3c943832f24f4eeff4e17f24960668e37d1e112a36
    container_name: fxvol-redis
    mem_limit: 320m
    cpu_shares: 256
    restart: unless-stopped
    volumes:
      - redis_data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    # Auth via --requirepass (never in the committed conf). The dev default is
    # deliberately non-empty so the auth path is always exercised (an empty
    # requirepass silently disables auth); prod sets REDIS_PASSWORD from SSM.
    command: ["redis-server", "/usr/local/etc/redis/redis.conf",
              "--requirepass", "${REDIS_PASSWORD:-fxvol-dev}"]
    environment:
      # redis-cli reads REDISCLI_AUTH — keeps the healthcheck working under auth.
      REDISCLI_AUTH: ${REDIS_PASSWORD:-fxvol-dev}
    networks:
      - fxvol-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    image: ${API_IMAGE:-fx-options-api:local}
    container_name: fxvol-api
    mem_limit: 512m
    cpu_shares: 1024
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://fxvol:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fxvol
      # Server-side cap per SQL statement on the api's connections (ms). A
      # slow read fails fast with a 500 instead of piling up across UI polls
      # until the pool is exhausted (prod incident 2026-11-04). Engines keep
      # the default (no cap). Cf. src/persistence/db.py.
      DB_STATEMENT_TIMEOUT_MS: ${API_DB_STATEMENT_TIMEOUT_MS:-20000}
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Internal URL of the execution-engine container. The api forwards
      # the /orders / /exec/positions actions to this service.
      EXECUTION_URL: http://execution-engine:8001
      # Shared secret on the engine's /internal/* routes (#300). Prod renders it
      # from SSM or a host-generated file (remote-deploy.sh); dev shares a default.
      EXECUTION_INTERNAL_TOKEN: ${EXECUTION_INTERNAL_TOKEN:-fxvol-dev-internal}
      # FRED API key for the multi-source events pipeline. Free signup at
      # https://fredaccount.stlouisfed.org/apikeys (~30s). Without it, the
      # FRED source is skipped and only the stub sources run (= no events
      # collected automatically).
      # Events pipeline: src/api/orchestration/events/.
      FRED_API_KEY: ${FRED_API_KEY:-}
      # Auth boundary (single-trader). Reads are public; writes need a valid
      # cookie. Login is CLOSED until AUTH_PASSWORD_HASH is set (pbkdf2_hmac
      # sha256 hex of the password, salt=AUTH_SALT). AUTH_COOKIE_SECURE=false
      # for local HTTP; prod sets these from SSM. Cf. src/api/auth.py.
      # Deployment env: "prod" arms the api boot guard (rejects the default
      # AUTH_SECRET + insecure cookies). Local/CI stay "dev" with zero setup.
      ENV: ${ENV:-dev}
      # uvicorn --proxy-headers only trusts X-Forwarded-For from
      # forwarded-allow-ips (default 127.0.0.1) — without this, every public
      # visitor behind nginx shares ONE rate-limit bucket. Only nginx's pinned
      # address is trusted (#296): a compose-internal peer cannot pick its own
      # rate-limit key by sending X-Forwarded-For, and nginx itself overwrites
      # the header with $remote_addr.
      FORWARDED_ALLOW_IPS: "172.20.0.15"
      AUTH_SECRET: ${AUTH_SECRET:-dev-insecure-change-me}
      AUTH_USERNAME: ${AUTH_USERNAME:-trader}
      AUTH_SALT: ${AUTH_SALT:-fxvol}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # PCA model refit cadence (hours). Default weekly (168h); lower it (e.g.
      # 0.1 ≈ 6min) to bootstrap fast locally alongside a low
      # capacity.pca_snapshot_interval_min in Settings (#371). A refit re-projects the whole snapshot window, so hourly
      # refits churn pca_signal_history — keep it slow in steady state.
      PCA_REFIT_INTERVAL_HOURS: ${PCA_REFIT_INTERVAL_HOURS:-168.0}
      # Backup freshness (#343): prod sets /state/postgres-backup.last (the
      # stamp infrastructure/ec2/postgres_backup.sh writes after each S3
      # upload); empty locally = no "backup" health component, no gauge.
      BACKUP_STATE_FILE: ${BACKUP_STATE_FILE:-}
    volumes:
      # Host-side state, read-only: the backup stamp above. On the EC2 host
      # ./state = /opt/fxvol/state (created by remote-deploy.sh); locally an
      # empty gitignored dir.
      - ./state:/state:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      fxvol-internal:
        ipv4_address: 172.20.0.13
    healthcheck:
      # Readiness (Postgres + Redis, 503 when either is down), not the constant
      # /health: nginx's depends_on and `docker ps` then show the real state
      # (#344, OPS-12).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  market-data:
    build:
      context: .
      dockerfile: src/engines/market_data/Dockerfile
    image: ${MARKET_DATA_IMAGE:-fx-options-market-data:local}
    container_name: fxvol-market-data
    mem_limit: 384m
    cpu_shares: 1024
    # Opt-in with the ``engines`` profile so a plain ``docker compose up``
    # (api demo) does not spin up a live IB connection.
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: market_data
      IB_HOST: ib-gateway
      # 4004 is the socat relay the ib-gateway image runs in front of TWS's
      # 4002 (socat TCP-LISTEN:4004,fork TCP:127.0.0.1:4002). Connecting
      # straight to 4002 makes TWS see the engine's container IP, which is
      # not in jts.ini TrustedIPs, so it accepts the socket then drops it.
      # Via the relay TWS sees 127.0.0.1, always trusted — and TWS rewrites
      # jts.ini on every boot, so maintaining TrustedIPs by hand never sticks.
      IB_PORT: 4004
      IB_CLIENT_ID: 1
      MARKET_SYMBOL: ${MARKET_SYMBOL:-EURUSD}
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      ib-gateway:
        condition: service_started
        required: false
    networks:
      fxvol-internal:
        ipv4_address: 172.20.0.10
    # P0 obs : Prometheus /metrics endpoint, scraped by Prometheus from
    # within fxvol-internal in P1. Spec § Phase 0 step 3.
    expose:
      - "9101"
    healthcheck:
      # One implementation shared with the image HEALTHCHECK (shared.healthcheck,
      # #344): heartbeat younger than 60 s (60x the ~1 s push cadence) and,
      # during FX market hours, a live EURUSD tick written within 120 s —
      # alive AND producing data, which is what the watchdog needs to know.
      test: ["CMD", "python", "-m", "shared.healthcheck", "heartbeat", "market_data", "60", "--tick", "EURUSD", "120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  vol-engine:
    build:
      context: .
      dockerfile: src/engines/vol/Dockerfile
    image: ${VOL_ENGINE_IMAGE:-fx-options-vol-engine:local}
    container_name: fxvol-vol-engine
    mem_limit: 512m
    cpu_shares: 256
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: vol_engine
      IB_HOST: ib-gateway
      # 4004 is the socat relay the ib-gateway image runs in front of TWS's
      # 4002 (socat TCP-LISTEN:4004,fork TCP:127.0.0.1:4002). Connecting
      # straight to 4002 makes TWS see the engine's container IP, which is
      # not in jts.ini TrustedIPs, so it accepts the socket then drops it.
      # Via the relay TWS sees 127.0.0.1, always trusted — and TWS rewrites
      # jts.ini on every boot, so maintaining TrustedIPs by hand never sticks.
      IB_PORT: 4004
      IB_CLIENT_ID: 2
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      # Step 1 regime gating : vol-engine reads feature_history / events /
      # vrp_table_default at each cycle (cf. STEP1 §7).
      DATABASE_URL: postgresql+asyncpg://fxvol:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fxvol
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Signal calibration (ex config/vol_config.json, R9 inline en env).
      THRESHOLD_VOL_PTS: ${THRESHOLD_VOL_PTS:-1.0}
      MODEL_P: ${MODEL_P:-har}
      # IB Gateway load smoothing: tenor concurrency and strikes per side are
      # in the capacity dial (Settings, #372); the subscribe gap drips the
      # per-tenor subscriptions into a rolling stream. Cf. engines.vol.chain_fetcher.
      VOL_SUBSCRIBE_GAP_S: ${VOL_SUBSCRIBE_GAP_S:-0.05}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      market-data:
        condition: service_started
      ib-gateway:
        condition: service_started
        required: false
    networks:
      fxvol-internal:
        ipv4_address: 172.20.0.11
    # P0 obs : Prometheus /metrics endpoint. Spec § Phase 0 step 3.
    expose:
      - "9102"
    healthcheck:
      # shared.healthcheck (#344). Max age 300 s because vol-engine cycle =
      # 30 s + 2-5 s of GARCH/SVI compute = ~5 min tolerated without a push.
      test: ["CMD", "python", "-m", "shared.healthcheck", "heartbeat", "vol_engine", "300"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 240s

  risk-engine:
    build:
      context: .
      dockerfile: src/engines/risk/Dockerfile
    image: ${RISK_ENGINE_IMAGE:-fx-options-risk-engine:local}
    container_name: fxvol-risk
    mem_limit: 384m
    cpu_shares: 512
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: risk_engine
      IB_HOST: ib-gateway
      # 4004 is the socat relay the ib-gateway image runs in front of TWS's
      # 4002 (socat TCP-LISTEN:4004,fork TCP:127.0.0.1:4002). Connecting
      # straight to 4002 makes TWS see the engine's container IP, which is
      # not in jts.ini TrustedIPs, so it accepts the socket then drops it.
      # Via the relay TWS sees 127.0.0.1, always trusted — and TWS rewrites
      # jts.ini on every boot, so maintaining TrustedIPs by hand never sticks.
      IB_PORT: 4004
      IB_CLIENT_ID: 3
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://fxvol:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fxvol
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vol-engine:
        condition: service_started
      ib-gateway:
        condition: service_started
        required: false
    networks:
      fxvol-internal:
        ipv4_address: 172.20.0.12
    # P0 obs : Prometheus /metrics endpoint. Spec § Phase 0 step 3.
    expose:
      - "9103"
    healthcheck:
      # shared.healthcheck (#344): heartbeat younger than 30 s.
      test: ["CMD", "python", "-m", "shared.healthcheck", "heartbeat", "risk_engine", "30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  db-writer:
    build:
      context: .
      dockerfile: src/engines/db_writer/Dockerfile
    image: ${DB_WRITER_IMAGE:-fx-options-db-writer:local}
    container_name: fxvol-db-writer
    mem_limit: 384m
    cpu_shares: 256
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: db_writer
      DATABASE_URL: postgresql+asyncpg://fxvol:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fxvol
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fxvol-internal
    # P0 obs : Prometheus /metrics endpoint. Spec § Phase 0 step 3.
    expose:
      - "9105"
    healthcheck:
      # shared.healthcheck (#344): heartbeat younger than 30 s. db-writer
      # suppresses its heartbeat while its subscriber is down, so this check
      # already reflects work, not just a loop.
      test: ["CMD", "python", "-m", "shared.healthcheck", "heartbeat", "db_writer", "30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  analytics-engine:
    build:
      context: .
      dockerfile: src/engines/analytics/Dockerfile
    image: ${ANALYTICS_ENGINE_IMAGE:-fx-options-analytics-engine:local}
    container_name: fxvol-analytics
    # HARD cpu cap. The hourly GMM refit + PCA snapshot + PC3 recompute used to
    # run inline in the vol-engine and spike BOTH t3.medium cores (the cascade).
    # Isolated here and capped to half a core, the batch can never saturate the
    # box — the real-time engines keep full speed and the kernel CFS spreads the
    # burst over wall-time. No IB (reads Redis/Postgres only), like db-writer.
    cpus: 0.5
    mem_limit: 512m
    cpu_shares: 128
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: analytics_engine
      DATABASE_URL: postgresql+asyncpg://fxvol:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fxvol
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Cadence, training window, PCA snapshot gap, rollup cadence and thread
      # cap come from the capacity dial in Settings (#371), hot-reloaded over
      # config:changed; nothing to set here.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vol-engine:
        # started, not healthy : analytics reads latest_vol_surface from Redis;
        # if it's absent the snapshot step just skips (best-effort), GMM/PC3 read
        # Postgres independently. Soft ordering only.
        condition: service_started
    networks:
      - fxvol-internal
    # P0 obs : Prometheus /metrics endpoint (9102 vol, 9103 risk, 9104 exec,
    # 9105 db-writer taken).
    expose:
      - "9106"
    healthcheck:
      # shared.healthcheck (#344). Compute is hourly but a decoupled loop ticks
      # the heartbeat every 60 s, so age stays < 120 s; 300 s tolerance.
      test: ["CMD", "python", "-m", "shared.healthcheck", "heartbeat", "analytics_engine", "300"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

  execution-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/execution.Dockerfile
    image: ${EXECUTION_IMAGE:-fx-options-execution:local}
    container_name: fxvol-execution
    # 384m OOM-killed the engine once the book grew to ~74 legs (anon-rss ~390 MB
    # at kill, 5 654 restarts by 2026-10-04) — the kernel killed uvicorn every
    # ~9 min and the engine never published a heartbeat.
    mem_limit: 512m
    cpu_shares: 1024
    profiles: ["engines"]
    restart: unless-stopped
    environment:
      SERVICE_NAME: execution
      DATABASE_URL: postgresql+asyncpg://fxvol:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/fxvol
      REDIS_URL: redis://:${REDIS_PASSWORD:-fxvol-dev}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # IB connection — clientId 5 (≠ 1 market-data, 2 vol, 3 risk, 4 reserved for legacy api).
      IB_HOST: ib-gateway
      # 4004 is the socat relay the ib-gateway image runs in front of TWS's
      # 4002 (socat TCP-LISTEN:4004,fork TCP:127.0.0.1:4002). Connecting
      # straight to 4002 makes TWS see the engine's container IP, which is
      # not in jts.ini TrustedIPs, so it accepts the socket then drops it.
      # Via the relay TWS sees 127.0.0.1, always trusted — and TWS rewrites
      # jts.ini on every boot, so maintaining TrustedIPs by hand never sticks.
      IB_PORT: 4004
      IB_CLIENT_ID: 5
      # Must mirror ib-gateway's READ_ONLY_API. A writable ib_async
      # handshake against a read-only gateway calls reqAutoOpenOrders,
      # which IB rejects (Error 321), so connect never completes and the
      # engine stays down instead of degrading to reads (account summary,
      # positions). Prod runs read-only, so this is the normal path there.
      IB_READ_ONLY: ${READ_ONLY_API:-no}
      EXECUTION_INTERNAL_TOKEN: ${EXECUTION_INTERNAL_TOKEN:-fxvol-dev-internal}
      # IB → Postgres sync cycle for orders/trades/positions/snapshots.
      # 5 s = compromise: the UI polls every 5 s on the front side, moderate
      # IB load (12 calls/min). Overridable via the EXECUTION_SYNC_INTERVAL_S env var.
      SYNC_INTERVAL_S: ${EXECUTION_SYNC_INTERVAL_S:-5.0}
      # Combo (BAG) execution : atomic all-or-nothing fill, no naked half-fill.
      # OFF by default — the IB PAPER simulator handles BAGs poorly (legs fill then
      # go flat, booking drifts from the account), so the transparent per-leg path
      # is the reliable default + the naked-residual flag surfaces the risk. Set
      # EXECUTION_USE_COMBO=1 to re-enable once validated on a combo-friendly venue.
      EXECUTION_USE_COMBO: ${EXECUTION_USE_COMBO:-0}
      # Reconcile the book to IB : auto-close booked positions the broker no longer
      # holds (guarded against transient/disconnected IB snapshots). Set to 0 to
      # only warn (trade_position_unreconciled) instead of closing.
      RECONCILE_AUTOCLOSE: ${RECONCILE_AUTOCLOSE:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ib-gateway:
        condition: service_started
        required: false
    networks:
      fxvol-internal:
        ipv4_address: 172.20.0.14
    # P0 obs : Prometheus /metrics endpoint. Spec § Phase 0 step 3.
    expose:
      - "9104"
    healthcheck:
      # /health answers 503 when IB is not connected or the position-sync loop
      # has stopped ticking (#344): unhealthy means it, not "the process is up".
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    image: ${FRONTEND_IMAGE:-fx-options-frontend:local}
    container_name: fxvol-frontend
    mem_limit: 64m
    cpu_shares: 512
    restart: unless-stopped
    networks:
      - fxvol-internal
    healthcheck:
      # `wget` ships with nginx:alpine (busybox). Checks that the static
      # bundle is reachable on the internal port 8080.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  ib-gateway:
    # Upstream unusualalpha publishes on ghcr.io but lags behind IB's
    # mandatory version bumps (seen 2026-04-22 : :stable = 10.19.1j
    # refused as obsolete). gnzsnz/ib-gateway is a drop-in fork that
    # rebuilds monthly. For a pinned local build see
    # `infrastructure/ib-gateway/README.md`.
    # Pinned default (NOT :latest). The Gateway install lives in the persisted
    # ib_gateway_jts volume, which Docker populates from the image only once —
    # a floating :latest that bumps the build strands old jars in the volume and
    # IBC dies "version X not installed". Bump this pin deliberately + refresh
    # the volume install (infrastructure/ib-gateway/README.md). Prod pins the
    # same tag via remote-deploy.sh's IB_GATEWAY_IMAGE.
    image: ${IB_GATEWAY_IMAGE:-ghcr.io/gnzsnz/ib-gateway:10.51.1e@sha256:85975f493bcacc8341cb42e6946c460868d165e5f64d9924b1958c8f03e7bee4}
    container_name: fxvol-ib-gateway
    mem_limit: 1500m
    cpu_shares: 1024
    # Opt-in : `docker compose --profile ib up -d` to include IB Gateway.
    # Keeps the default `docker compose up` light and avoids the 4002
    # port-bind when another service (or a Windows reserved range) already
    # owns it. A local tool can still connect to localhost:4002,
    # so it must be started explicitly when needed.
    profiles: ["ib"]
    restart: unless-stopped
    environment:
      # Empty-tolerant on purpose: compose interpolates the WHOLE file before
      # profile filtering, so a strict :? here breaks every compose command on
      # hosts without IB creds (prod core-only). Fail-fast is preserved: the
      # gnzsnz entrypoint refuses empty creds when the ib profile actually runs.
      TWS_USERID: ${IB_USERID:-}
      TWS_PASSWORD: ${IB_PASSWORD:-}
      TRADING_MODE: ${TRADING_MODE:-paper}
      READ_ONLY_API: ${READ_ONLY_API:-no}
      # IBC lifecycle : daily auto-logout at 23:59 Paris is cleaner than a
      # weekly one — IB sessions stale silently otherwise.
      TWS_SETTINGS_PATH: /home/ibgateway/Jts
      AUTO_RESTART_TIME: "11:59 PM"
      # 2FA handling : give IBC 3 min for push validation, then restart
      # instead of crash-looping on timeout.
      TWOFA_TIMEOUT_ACTION: restart
      BYPASS_WARNING: "yes"
      # VNC password loaded from SSM via scripts/local/load_secrets.ps1. Empty-
      # tolerant for the same reason as TWS_USERID above (whole-file
      # interpolation); the container only runs with the ib profile armed.
      VNC_SERVER_PASSWORD: ${VNC_PASSWORD:-}
    ports:
      # Bind IB Gateway API port and VNC to 127.0.0.1 only — a local tool
      # app on the host still needs to reach the gateway on localhost:4002,
      # but we do NOT want to expose either port to the LAN.
      - "127.0.0.1:4002:4002"
      - "127.0.0.1:5900:5900"
    networks:
      - fxvol-internal
      - fxvol-external
    volumes:
      # Persist Gateway runtime settings across container recreates.
      # The .ibgzenc encrypted file in $TWS_SETTINGS_PATH/<userid_hash>/
      # is where the GUI Save Settings writes the API config (Trusted
      # IPs, "Allow connections from localhost only", etc.). IBC enforces
      # `TrustedIPs=127.0.0.1` in jts.ini at every boot via its hardcoded
      # SettingsFileEnsurer Java class, but Gateway runtime reads from
      # the .ibgzenc — which we control via this volume.
      #
      # Initial setup (one-shot after first compose up): connect to VNC
      # on 127.0.0.1:5900, Configure → Settings → API → Settings:
      #   - uncheck "Allow connections from localhost only"
      #   - Trusted IPs (one by one, the GUI rejects CIDRs):
      #       127.0.0.1     (loopback, IBC always re-adds it)
      #       172.20.0.10   (market-data, static IP pinned in compose)
      #       172.20.0.11   (vol-engine,  static IP pinned in compose)
      #       172.20.0.12   (risk-engine, static IP pinned in compose)
      #   - OK + File → Save Settings
      # Subsequent boots reload these settings from the volume — no need
      # to touch the GUI again as long as the IPs do not move (and they
      # no longer move, cf. ipam.config.subnet below).
      - ib_gateway_jts:/home/ibgateway/Jts
    healthcheck:
      # tcp probe — gnzsnz/ib-gateway is minimal (no nc, netstat, curl,
      # python3, no bash net-redirections). socat is shipped (used by
      # IBC's VNC bridge) and gives a real TCP probe equivalent to the
      # original `nc -z` intent, catching both JVM death AND the
      # dead-socket-but-live-process state.
      test: ["CMD-SHELL", "socat /dev/null TCP:127.0.0.1:4002,connect-timeout=2 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11
    container_name: fxvol-nginx
    mem_limit: 64m
    cpu_shares: 1024
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # T2 logs unification : JSON access log format loaded first via
      # alpha-ordered include (00-* before default.conf).
      - ./infrastructure/nginx/log-format-json.conf:/etc/nginx/conf.d/00-log-format.conf:ro
      # Conf is env-driven : dev defaults to the HTTP-only conf ; prod sets
      # NGINX_CONF_FILE=./infrastructure/nginx/nginx.conf (TLS) in /opt/fxvol/.env.
      - ${NGINX_CONF_FILE:-./infrastructure/nginx/nginx-dev.conf}:/etc/nginx/conf.d/default.conf:ro
      - ${LETSENCRYPT_DIR:-./infrastructure/nginx/letsencrypt-empty}:/etc/letsencrypt:ro
      - ${CERTBOT_WWW_DIR:-./infrastructure/nginx/certbot-www-empty}:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      fxvol-public: {}
      fxvol-internal:
        # Pinned (reserved range .2-.127): the api's FORWARDED_ALLOW_IPS trusts
        # exactly this address for X-Forwarded-For (#296).
        ipv4_address: 172.20.0.15
    healthcheck:
      # /healthz exists in both confs; plain / follows the prod 301->https
      # and would wedge depends_on.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ── P1 obs — LGTM stack (Loki + Grafana + Tempo + Prometheus) ────────
  # Opt-in via `docker compose --profile obs up -d`. All 7 services live on
  # fxvol-internal so Prometheus reaches the engine /metrics ports without any
  # host-side mapping. Grafana also gets fxvol-public for browser access.
  #
  # `metrics` is a deliberate SUBSET of `obs`: prometheus + cadvisor only, i.e.
  # exactly what the /dev Hardware tab needs to plot per-container CPU/RAM. It
  # exists so a minimal host can have those graphs alone. Since #298 the full
  # `obs` set is the prod allowlist too: cadvisor unprivileged, alloy behind
  # docker-socket-proxy, Grafana loopback-only with anonymous access off and
  # the admin password from SSM. cadvisor/prometheus list both profiles, so
  # `--profile obs` starts the full LGTM set — tempo + otel-collector included:
  # the t3.medium has the RAM headroom, so traces stay part of `./all/up`.

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    container_name: fxvol-prometheus
    profiles: ["obs", "metrics"]
    # Measured ~91 MB with the full 17-container local stack; the prod box is
    # a t3.small (2 GB) running core-only, so the ceiling is ~3x headroom.
    mem_limit: 256m
    cpu_shares: 128
    restart: unless-stopped
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./obs/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    command:
      # Retention is env-tunable because the same file serves a 16 GB laptop
      # and a 2 GB EC2 box. The default is the prod-safe one — raise it in a
      # local .env if you want a longer local history.
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROM_RETENTION_TIME:-7d}'
      - '--storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-512MB}'
      - '--web.enable-lifecycle'
    environment:
      # obs/prometheus.yml labels every series with it (#346).
      FXVOL_ENVIRONMENT: ${ENV:-dev}
    networks:
      - fxvol-internal
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Alert router (#342): Prometheus rules (obs/alerts.yml) -> SNS fxvol-alarms
  # (email). Signs with the EC2 instance role through IMDS; locally the send
  # fails harmlessly and the UI on :9093 still shows the alerts.
  alertmanager:
    image: prom/alertmanager:v0.35.0@sha256:e638797febd034838eca8b98cdbd46f951e9bf7f178777aa8669167406a9946c
    container_name: fxvol-alertmanager
    profiles: ["obs", "metrics"]
    mem_limit: 64m
    cpu_shares: 128
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--data.retention=120h'
    environment:
      AWS_REGION: ${AWS_REGION:-eu-west-1}
    volumes:
      - ./obs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    networks:
      - fxvol-internal
    expose:
      - "9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Per-container CPU/RAM/net/fs metrics → scraped by Prometheus. The standard
  # way to graph "how much does each container consume" (locally + on EC2).
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    container_name: fxvol-cadvisor
    profiles: ["obs", "metrics"]
    # Measured ~21 MB locally. NOTE: on Docker Desktop / WSL2 cAdvisor only
    # sees the root cgroup, so it reports nothing per-container and the api
    # falls back to the docker.sock path (dev override). On a real Linux
    # kernel (EC2) this is the path that actually serves the Hardware tab.
    mem_limit: 128m
    cpu_shares: 128
    restart: unless-stopped
    # Not privileged (#298, audit 01#10): the read-only mounts below are all
    # cAdvisor needs for per-container CPU / RAM / net / fs on cgroup v1 and v2.
    # What it loses without privilege: host OOM events from /dev/kmsg, which the
    # Hardware tab never showed.
    command:
      # 5s housekeeping so cAdvisor actually produces 5s-fresh samples for the
      # Hardware tab's 5s Prometheus scrape (else Prometheus reads duplicates).
      - '--housekeeping_interval=5s'
      - '--docker_only=true'
      - '--store_container_labels=false'
    # NOTE: per-container metrics require the host's Docker to use the CLASSIC
    # overlay2 image store, NOT the containerd image store (storage driver
    # "overlayfs"). With the containerd store cAdvisor v0.49.x can't resolve each
    # container's read-write layer and, under --docker_only, fails registration —
    # the Hardware tab then shows nothing. setup.sh pins overlay2 via
    # daemon.json {"features":{"containerd-snapshotter":false}}.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - fxvol-internal
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: fxvol-loki
    profiles: ["obs"]
    # Memory cap (#293). 2026-11-02 : the obs profile ran uncapped on the
    # 3.8 GB prod host, Tempo grew to ~1.4 GB, the host OOM'd and SSM lost it.
    # A capped container is OOM-killed and restarted on its own instead.
    mem_limit: 320m
    cpu_shares: 128
    environment:
      GOMEMLIMIT: 256MiB   # Go GC target below the cgroup cap
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./obs/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    networks:
      - fxvol-internal
    expose:
      - "3100"
    # No healthcheck: since #415 the image is distroless (no shell, no wget).
    # Prometheus scrapes :3100/metrics, so `up{job="loki"}` is the liveness
    # signal; nothing waits on this service being healthy.

  # Ships container stdout to Loki (#415): Grafana Alloy, promtail's
  # successor (promtail is end-of-life upstream). Same pipeline, converted
  # with `alloy convert`; see obs/alloy.alloy.
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: fxvol-alloy
    profiles: ["obs"]
    mem_limit: 128m   # #415: ~40 MB idle with the obs set; same cap as otel-collector
    cpu_shares: 128
    environment:
      GOMEMLIMIT: 100MiB
    restart: unless-stopped
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    volumes:
      - ./obs/alloy.alloy:/etc/alloy/config.alloy:ro
      - alloy_data:/var/lib/alloy/data
      # No Docker socket here (#298, audit 01#8): container discovery and log
      # reads go through docker-socket-proxy, which allows GET /containers only.
    depends_on:
      # started, NOT healthy: Alloy retries pushing to Loki, so waiting on
      # Loki's slow health (start_period 45s) only made `up` race and fail.
      loki:
        condition: service_started
      docker-socket-proxy:
        condition: service_started
    networks:
      - fxvol-internal

  tempo:
    image: grafana/tempo:2.10.10@sha256:12b0820f13ffa10ce956b6e9acc3b03f3cffded99109be6cc09d106fe56e5d38
    container_name: fxvol-tempo
    profiles: ["obs"]
    # Memory cap (#293). 2026-11-02 : the obs profile ran uncapped on the
    # 3.8 GB prod host, Tempo grew to ~1.4 GB, the host OOM'd and SSM lost it.
    # A capped container is OOM-killed and restarted on its own instead.
    mem_limit: 320m
    cpu_shares: 128
    environment:
      GOMEMLIMIT: 256MiB
    restart: unless-stopped
    command: -config.file=/etc/tempo.yml
    volumes:
      - ./obs/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    networks:
      - fxvol-internal
    expose:
      - "3200"   # Tempo HTTP query
      - "4317"   # OTLP gRPC ingest (from otel-collector)
    # No healthcheck: since #415 the image is distroless (no shell, no wget).
    # Prometheus scrapes :3200/metrics, so `up{job="tempo"}` is the liveness
    # signal; nothing waits on this service being healthy.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.165.0@sha256:e40d61f10c9a617cca1ffd1be4d7e2b3a4b0f0001798ff07e58cabe82e618cea
    container_name: fxvol-otel-collector
    profiles: ["obs"]
    mem_limit: 128m   # #293 ; memory_limiter processor at 96 MiB in obs/otel-collector.yml
    cpu_shares: 128
    environment:
      GOMEMLIMIT: 96MiB
    restart: unless-stopped
    command: ["--config=/etc/otel-collector.yml"]
    volumes:
      - ./obs/otel-collector.yml:/etc/otel-collector.yml:ro
    depends_on:
      # started, NOT healthy: the collector retries its OTLP export to Tempo, so
      # it needn't wait on Tempo's health (start_period 30s) — that raced `up`.
      tempo:
        condition: service_started
    networks:
      - fxvol-internal
    expose:
      - "4317"   # OTLP gRPC receiver (engines send here)

  # The only obs container that touches the Docker socket (#298): a filtering
  # proxy that answers GET /containers/* (list, inspect, logs) and refuses
  # everything else (no exec, no create, no POST). alloy talks to it over
  # the internal network; the socket itself is mounted read-only here.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    container_name: fxvol-docker-socket-proxy
    profiles: ["obs"]
    mem_limit: 64m   # v0.5.0 idles at ~30 MB (#415)
    cpu_shares: 64
    restart: unless-stopped
    environment:
      CONTAINERS: "1"
      # Alloy's Docker discovery reads each container's networks (GET only).
      NETWORKS: "1"
      POST: "0"
      LOG_LEVEL: warning
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fxvol-internal
    expose:
      - "2375"

  grafana:
    image: grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    container_name: fxvol-grafana
    profiles: ["obs"]
    mem_limit: 256m   # #293, raised by #415: Grafana 13 idles at ~160 MB with the provisioned dashboards
    cpu_shares: 128
    restart: unless-stopped
    environment:
      # Anonymous access is view-only; edits/admin go through the login form.
      # Never Admin, even in dev. On prod remote-deploy.sh renders
      # GF_AUTH_ANONYMOUS_ENABLED=false and requires GRAFANA_ADMIN_PASSWORD from
      # SSM (#298); the port below is loopback-only, reached over an SSM port
      # forward. The dev defaults here never serve on the public host.
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_AUTH_ANONYMOUS_ENABLED:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_COOKIE_SAMESITE: "lax"
      # Grafana 12+ downloads bundled plugins at boot; this stack uses only the
      # built-in Prometheus / Loki / Tempo datasources (#415).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./obs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      # started, NOT healthy: Grafana retries its datasource connections, so it
      # doesn't need Prometheus/Loki healthy at boot — waiting on Loki's slow
      # health (start_period 45s) is what made `up` fail while everything else
      # came up. Grafana's own healthcheck still gates anything depending on IT.
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - fxvol-internal
    # Loopback-only on every host: direct browser access in dev, an SSM port
    # forward on prod (`aws ssm start-session ... --document-name
    # AWS-StartPortForwardingSession`). Never a public bind (#298).
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # Exposed to the public internet — only nginx lives here (R6 PR #3).
  fxvol-public:
    driver: bridge
  # Back-of-house services that only talk to each other (api, postgres,
  # redis, frontend bundle server, ib-gateway).
  fxvol-internal:
    driver: bridge
    internal: false
    # Subnet pinned so that the engines get stable, readable IPs that can
    # be trusted once and for all on the IB Gateway side. Without it Docker
    # picks a random range in 172.17-31, and every `compose down` can change
    # the subnet → stale TrustedIPs whitelist.
    ipam:
      config:
        # ip_range is MANDATORY: without it Docker auto-assigns the dynamic IPs
        # (db-writer, nginx, alloy, grafana…) across the whole /24 starting at .2,
        # and grabs .10/.11/.12/.13/.14 — the engines' pinned static IPs.
        # The 1st engine that wants its .10 then crashes with "Address already in use".
        # So we confine the dynamic pool to the upper half (.128–.254) and keep
        # .2–.127 reserved for the static pins above (engines + api + execution).
        - subnet: 172.20.0.0/24
          ip_range: 172.20.0.128/25
  # Outbound-only lane for IB Gateway — lets it reach IB servers while
  # keeping the rest of the stack isolated from the wider internet.
  fxvol-external:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  # IB Gateway settings persistence — see § ib-gateway above.
  ib_gateway_jts:
  # P1 obs — LGTM stack persistent storage.
  prom_data:
  loki_data:
  alertmanager_data:
  grafana_data:
  # P2 obs — Tempo traces storage (7 days retention).
  tempo_data:
  alloy_data:
