name: security-scan

# Weekly dependency scan (#304, audit 10): pip-audit on uv.lock, npm audit
# on the frontend lockfile, the two license gates, and Trivy on every image
# the stack runs — the 8 images we build, at the tag prod is running (read
# from /health, not :latest), plus the infra images pinned in
# docker-compose.yml. HIGH / CRITICAL findings fail the run and land in the
# Security tab as SARIF; triage decisions are recorded in
# docs/ops/dependency-policy.md (pip-audit ignores, .trivyignore).
#
# Trigger: Monday 03:00 UTC + manual dispatch (optionally with a tag).

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Built-image tag to scan (default: the sha- tag prod reports on /health)"
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  security-events: write  # SARIF upload to the Security tab

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  PROD_HEALTH: https://valeriandarmente.dev/fx-volatility-trading-system/api/v1/health
  UV_VERSION: "0.13.7"

jobs:
  resolve:
    name: Resolve the deployed tag and the infra images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      infra: ${{ steps.infra.outputs.infra }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Deployed tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            sha=$(curl -fsS --max-time 20 "$PROD_HEALTH" | jq -r '.git_sha // empty')
            [ -n "$sha" ] || { echo "::error::prod /health returned no git_sha"; exit 1; }
            tag="sha-$sha"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "scanning built images at $tag"

      - name: Infra images from docker-compose.yml
        id: infra
        run: |
          set -euo pipefail
          infra=$(python3 - <<'EOF'
          import json, re
          text = open("docker-compose.yml", encoding="utf-8").read()
          images = sorted({m for m in re.findall(r"^\s+image: (\S+)$", text, re.M) if not m.startswith("${")})
          gateway = re.search(r"IB_GATEWAY_IMAGE:-(\S+)\}", text)
          if gateway:
              images.append(gateway.group(1))
          print(json.dumps(images))
          EOF
          )
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          echo "$infra"

  pip-audit:
    name: pip-audit (uv.lock, all extras)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Export the lock and audit it
        # --no-deps: the export is the fully resolved set, pinned; pip-audit
        # must not re-resolve. Ignored ids live in the policy's triage log.
        env:
          PIP_AUDIT_IGNORE: ""   # space-separated vulnerability ids, each justified in docs/ops/dependency-policy.md
        run: |
          set -euo pipefail
          python -m pip install "uv==$UV_VERSION" "pip-audit==2.10.1"
          uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements-lock.txt
          ignores=""
          for id in $PIP_AUDIT_IGNORE; do ignores="$ignores --ignore-vuln $id"; done
          # shellcheck disable=SC2086
          pip-audit -r requirements-lock.txt --no-deps --strict --desc on --progress-spinner off $ignores

  npm-audit:
    name: npm audit (frontend lockfile)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install from the lockfile
        run: npm ci --ignore-scripts

      - name: Audit shipped packages (fails on high / critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit the dev toolchain (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high

  licenses:
    name: License gates (Python + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install the locked set
        run: |
          python -m pip install "uv==$UV_VERSION"
          uv sync --locked --all-extras
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Python license gate
        run: python scripts/ci/check_licenses.py

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install the frontend lockfile
        run: npm ci --ignore-scripts
        working-directory: frontend

      - name: npm license gate (shipped packages)
        run: node scripts/ci/check_licenses_npm.mjs

  trivy-built:
    name: Trivy built image (${{ matrix.image }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          - fx-options-api
          - fx-options-frontend
          - fx-options-market-data
          - fx-options-vol-engine
          - fx-options-risk-engine
          - fx-options-db-writer
          - fx-options-analytics-engine
          - fx-options-execution
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy (deployed tag)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}:${{ needs.resolve.outputs.tag }}
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"          # fail the job on any HIGH/CRITICAL
          ignore-unfixed: true    # unfixed upstream issues do not fail
          limit-severities-for-sarif: true   # the Security tab gets the gate's scope, not every LOW
          trivyignores: .trivyignore

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  trivy-infra:
    name: Trivy infra image (${{ matrix.image }})
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.infra) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Category = repository name without tag or digest (grafana/loki ->
      # trivy-infra-grafana-loki), so a version bump rescans the same category
      # and closes the old version's alerts. A job index shifts or disappears
      # when the image list changes, leaving alerts open forever.
      - name: Category
        id: cat
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          name="${IMAGE%%[:@]*}"
          echo "name=trivy-infra-${name//\//-}" >> "$GITHUB_OUTPUT"

      - name: Trivy (pinned infra image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          format: sarif
          output: ${{ steps.cat.outputs.name }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          limit-severities-for-sarif: true
          trivyignores: .trivyignore

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ steps.cat.outputs.name }}.sarif
          category: ${{ steps.cat.outputs.name }}
