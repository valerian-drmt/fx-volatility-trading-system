name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base: a stacked PR (B based on A's branch) gets its
  # own CI while A's runs, so the stack merges back to back once green.
  pull_request:
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run manual IB paper integration tests"
        required: false
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN (#302): every job here only reads the repo;
# artifacts and caches need no extra scope.
permissions:
  contents: read

jobs:
  quality:
    name: compileall + ruff + pytest
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Python dependencies (uv.lock)
        run: |
          python -m pip install "uv==0.13.7"
          uv lock --check
          uv sync --locked --extra dev --extra api --extra quant --extra writer
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Static import check (compileall)
        run: python -m compileall -q src

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Architecture lint (import-linter contracts)
        run: PYTHONPATH=src lint-imports

      # Gated: the packages that are clean stay clean (#335). The whole-tree
      # run below stays advisory while core / api / engines burn down.
      - name: Type check (mypy, gated packages)
        run: python -m mypy src/shared src/bus src/persistence

      - name: Type check (mypy, advisory on the whole tree)
        continue-on-error: true
        run: python -m mypy

      - name: Run tests (pytest, excluding integration)
        run: python -m pytest -m "not integration and not db_integration and not redis_integration" --cov=src --cov-report=term --cov-report=xml --cov-report=json --junitxml=junit.xml

      # Per-package floors (#340): pyproject [tool.fxvol.coverage-floors].
      - name: Coverage floors per package
        run: python scripts/ci/check_coverage.py coverage.json

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: coverage.xml
          retention-days: 14

      - name: Upload pytest JUnit artefact on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-junit
          path: junit.xml
          retention-days: 14

  frontend:
    name: frontend pipeline (openapi drift + lint + vitest + build artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # R8 PR #3 consolidates the frontend gates into a single job : OpenAPI
    # drift guard against a freshly-dumped FastAPI schema, strict lint,
    # typecheck, Vitest with an honest-denominator coverage floor, production
    # build and artefact upload of the resulting dist/ bundle so downstream
    # jobs (deploy in PR #5) can pull it without rebuilding.

    env:
      PYTHONPATH: src

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Python step is needed before Node because `frontend/scripts/dump_openapi.py`
      # spits the live OpenAPI schema that openapi-typescript consumes.
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Python dependencies (uv.lock)
        run: |
          python -m pip install "uv==0.13.7"
          uv sync --locked --extra api
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Dump live OpenAPI schema
        run: python frontend/scripts/dump_openapi.py openapi.json

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: OpenAPI drift check (schema.d.ts vs live FastAPI)
        working-directory: frontend
        run: |
          node scripts/check-api-drift.mjs ../openapi.json

      - name: Lint (--max-warnings 0)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests with coverage floor (see vitest.config.ts thresholds)
        working-directory: frontend
        run: npm run test:coverage

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist/ artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fx-options-frontend-dist
          path: frontend/dist
          retention-days: 14

  nginx-config:
    name: nginx -t syntax + pytest parse
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # frontend.conf and nginx-dev.conf have no TLS cert paths — nginx -t can
      # validate them directly. nginx.conf (prod) needs stub certs + resolvable
      # upstream hosts — see the dedicated step below.
      - name: nginx -t frontend.conf + nginx-dev.conf
        run: |
          docker run --rm -v "$PWD/infrastructure/nginx":/conf:ro nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11 \
            sh -c 'set -e; for f in /conf/frontend.conf /conf/nginx-dev.conf; do
              printf "events{}\nhttp{\n  include %s;\n}\n" "$f" > /tmp/nginx.conf;
              nginx -t -c /tmp/nginx.conf;
            done'

      # Prod conf: self-signed placeholder certs (same trick init-letsencrypt.sh
      # uses) + /etc/hosts entries because nginx -t resolves upstream{} hosts.
      - name: nginx -t nginx.conf (prod, stub certs)
        run: |
          docker run --rm -v "$PWD/infrastructure/nginx":/conf:ro nginx:1.31.8-alpine@sha256:713fc2ebfd92e8217db451477182ee91944b123d2b1ee9fd5a8c6e91ca6c3a11 \
            sh -c 'set -e;
              echo "127.0.0.1 frontend api" >> /etc/hosts;
              d=/etc/letsencrypt/live/valeriandarmente.dev; mkdir -p "$d";
              apk add --no-cache openssl >/dev/null;
              openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
                -keyout "$d/privkey.pem" -out "$d/fullchain.pem" -subj "/CN=ci" 2>/dev/null;
              printf "events{}\nhttp{\n  include /conf/nginx.conf;\n}\n" > /tmp/nginx.conf;
              nginx -t -c /tmp/nginx.conf'

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: pytest parse check on every config
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests/unit/infrastructure/test_nginx_config_syntax.py -v

  frontend-e2e:
    name: frontend Playwright e2e
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build bundle
        run: npm run build

      - name: Run Playwright e2e
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  frontend-e2e-compose:
    name: Playwright e2e against ephemeral docker-compose stack
    # R8 PR #4 : the existing frontend-e2e job runs against vite preview
    # with MSW / route.fulfill mocks. This job brings up the real api,
    # frontend container, Nginx, postgres and redis, then
    # points Playwright at http://localhost (Nginx entrypoint). Validates
    # the full wiring is reachable through the reverse proxy, not just
    # the bundle in isolation.
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 20

    env:
      DB_PASSWORD: fxvol
      VNC_PASSWORD: ci-placeholder
      # ib-gateway is not started here (no `ib` profile), but compose still
      # interpolates its ${IB_USERID:?}/${IB_PASSWORD:?} at parse time.
      IB_USERID: ci-placeholder
      IB_PASSWORD: ci-placeholder
      PLAYWRIGHT_BASE_URL: http://localhost
      # Unmocked round trip (#341): e2e/live-roundtrip.spec.ts runs only here.
      E2E_LIVE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Boot docker compose stack
        run: docker compose up -d --build

      - name: Apply Alembic migrations
        run: |
          docker compose exec -T api \
            python -m alembic -c src/persistence/alembic.ini upgrade head

      - name: Wait for Nginx to serve the frontend
        run: |
          for i in $(seq 1 30); do
            curl -fsS http://localhost/ > /dev/null && exit 0
            sleep 2
          done
          echo "Nginx did not respond in 60s"
          docker compose ps
          docker compose logs --tail=100
          exit 1

      # Seed a market through the real bus code (no IB in CI): the vol engine's
      # canonical surface payload, and ticks every 500 ms for the whole run.
      - name: Seed the market (surface + ticks) through the bus
        run: |
          docker compose exec -T api python scripts/e2e/seed_market.py surface < tests/fixtures/payloads/vol_update.json
          docker compose exec -d api python scripts/e2e/seed_market.py ticks --bid 1.12345 --ask 1.12347 --seconds 900
          # the api answers the seeded surface before the browser starts
          for i in $(seq 1 15); do
            curl -fsS http://localhost/api/v1/vol/surface | grep -q '"1M"' && exit 0
            sleep 2
          done
          echo "seeded surface not served"; curl -sS http://localhost/api/v1/vol/surface; exit 1

      - name: Set up Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e against http://localhost
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-compose
          path: frontend/playwright-report
          retention-days: 7

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs --tail=300

      - name: Tear down compose
        if: always()
        run: docker compose down --remove-orphans --volumes

  frontend-image:
    name: build frontend docker image
    runs-on: ubuntu-latest
    needs: frontend
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build fx-options-frontend (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: false
          tags: fx-options-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  live-integration:
    name: alembic + writer + redis bus live tests
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 8

    services:
      postgres:
        image: postgres:16.15-alpine3.24@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: fxvol
          POSTGRES_PASSWORD: fxvol
          POSTGRES_DB: fxvol
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxvol -d fxvol"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        # Plain redis:7-alpine (no hardened redis.conf mount).
        # The hardened config in infrastructure/redis/redis.conf disables
        # FLUSHDB / CONFIG for prod safety, but tests use per-key DELETE
        # for cleanup so the defaults are fine here and keep the CI setup
        # minimal (no bind-mount gymnastics).
        image: redis:7.4.12-alpine3.22@sha256:acc6f0ac39f6fe3a39c57b3c943832f24f4eeff4e17f24960668e37d1e112a36
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      PYTHONPATH: src
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      DATABASE_URL: postgresql+asyncpg://fxvol:fxvol@localhost:5432/fxvol
      DB_RUN_INTEGRATION: "1"
      REDIS_URL: redis://localhost:6379/0
      REDIS_RUN_INTEGRATION: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      - name: Install Python dependencies (uv.lock)
        run: |
          python -m pip install "uv==0.13.7"
          uv sync --locked --extra dev --extra api --extra quant --extra writer
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run alembic upgrade head
        run: python -m alembic -c src/persistence/alembic.ini upgrade head

      # Schema drift gate (#325, audit 05#5): the ORM models and the migration
      # chain must describe the same schema. ``alembic check`` runs the
      # autogenerate comparison and fails on any pending diff (type changes
      # included, env.py sets compare_type).
      - name: Schema drift gate (alembic check)
        run: python -m alembic -c src/persistence/alembic.ini check

      # Downgrade round trip over this release's migrations: head -> N back ->
      # head. Early revisions are not round-trippable (renames across
      # dropped tables); N covers everything since the last deployed tag and
      # is bumped with each release (docs/ops/deployment.md).
      - name: Migration round trip (head -> -N -> head)
        env:
          ALEMBIC_ROUNDTRIP_STEPS: "9"
        run: |
          python -m alembic -c src/persistence/alembic.ini downgrade "-${ALEMBIC_ROUNDTRIP_STEPS}"
          python -m alembic -c src/persistence/alembic.ini upgrade head
          python -m alembic -c src/persistence/alembic.ini check

      - name: Run db_integration tests
        run: python -m pytest -m db_integration -v

      - name: Run redis_integration tests
        run: python -m pytest -m redis_integration -v

  integration:
    name: IB paper integration tests (manual only)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.run_integration == 'true'
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20

    env:
      PYTHONPATH: src
      IB_RUN_INTEGRATION: "1"
      IB_HOST: ${{ secrets.IB_HOST }}
      IB_PORT: ${{ secrets.IB_PORT }}
      IB_CLIENT_ID: ${{ secrets.IB_CLIENT_ID }}
      IB_READONLY: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Cache uv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install Python dependencies (uv.lock)
        run: |
          python -m pip install "uv==0.13.7"
          uv sync --locked --extra dev --extra ib
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Run integration tests
        run: python -m pytest -m "integration" -rs
