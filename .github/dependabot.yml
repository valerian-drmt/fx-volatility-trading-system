# Dependabot keeps every pin current (#302, #303, #305): the SHA-pinned
# actions, the base-image digests in the Dockerfiles and compose, uv.lock
# and the frontend lockfile. One PR per ecosystem per week, minor and patch
# bumps grouped so the queue stays reviewable; a major bump is its own PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type:chore", dependencies]

  - package-ecosystem: docker
    directories:
      - /infrastructure/docker
      - /src/engines/analytics
      - /src/engines/db_writer
      - /src/engines/market_data
      - /src/engines/risk
      - /src/engines/vol
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["type:chore", dependencies]
    groups:
      base-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["type:chore", dependencies]
    groups:
      infra-images:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The gateway build is pinned by hand after a paper soak (the 10.48 -> 10.49
      # volume drift outage is the precedent, docs/ops/dependency-policy.md).
      - dependency-name: "ghcr.io/gnzsnz/ib-gateway"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["type:chore", dependencies]
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Exact-pinned on purpose: archived upstream, migration tracked separately (#306).
      - dependency-name: "ib-insync"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: ["type:chore", dependencies]
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
